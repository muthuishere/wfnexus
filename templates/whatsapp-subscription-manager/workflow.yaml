# whatsapp-subscription-manager — manage subscriptions from a chat or an agent.
#
# The same seven verbs as `wfx sub` (add, update, pause, resume, rm, ls,
# validate), as a workflow — so it can be exposed as a hook and an MCP tool
# (ADR 0027) and driven by an agent ("subscribe pingpong to the test group")
# or by frontdesk handing off. It talks only to $WFX_API.
#
# Expose it (a person does this, once):
#   wfx expose mcp whatsapp-subscription-manager     # an MCP tool, input = input_schema
#   wfx expose hook whatsapp-subscription-manager    # POST /hooks/<project>/whatsapp-subscription-manager
#
# The 7-point bar:
#   trigger        hook, MCP tools/call, `start:` from a handler, or a person
#   system of record  the server's subscriptions (registries.json, hot-reloaded)
#   typed output   {action, name, ok, verified, status, problem, warning, subscription, subscriptions, error}
#   verification   every change is READ BACK; ok only when the server shows the expected status
#   human gate     rm, and "everyone may start an auto-replying workflow", wait for approval
#   no silent failure  an API refusal or a read-back mismatch fails the run with the reason
#   success number    changes verified on first try / changes requested
name: whatsapp-subscription-manager
template:
  title: WhatsApp subscription manager — add, pause, resume, remove, list, validate
  category: debugging-ops
  summary: >-
    Manages WhatsApp subscriptions through the wfnexus API and reads every
    change back. Expose it over MCP or a hook so an agent or a chat can
    subscribe a workflow to a group without opening the UI.
  fill:
    - "nothing required — WFX_API is set for every run; set WFX_TOKEN in the project env if your API needs a bearer token"
    - "expose it: wfx expose mcp whatsapp-subscription-manager (and/or hook)"

description: >-
  Adds, updates, pauses, resumes, removes, lists or validates a WhatsApp
  subscription through the wfnexus API, then reads it back to prove the change.
  Removing one, or letting everyone start an auto-replying workflow, waits for
  a person's approval.

on: [workflow_dispatch, workflow_call]

memory:
  scope: workflow

input_schema:
  type: object
  required: [action]
  properties:
    action:         { type: string, enum: [add, update, pause, resume, rm, ls, validate] }
    name:           { type: string, title: "Subscription name (all but ls)" }
    channel:        { type: string, title: "Channel (registries.json); for ls, narrows the list" }
    chat:           { type: string, title: "Chat JID, or * for every chat (observe only)" }
    workflow:       { type: string, title: "Workflow a matching event starts" }
    version:        { type: string }
    events:         { type: string, title: "message, reaction, updated, deleted, workflow.completed — comma separated" }
    interval:       { type: string, enum: ["30s", "1m", "2m"] }
    skills:         { type: string, title: "Skills, comma separated" }
    instructions:   { type: string }
    responsePolicy: { type: string, enum: [draft, approval, auto, none] }
    memory:         { type: string }
    mode:           { type: string, enum: [fanout, exclusive, observe] }
    activation:     { type: string, enum: [mention, always] }
    allow:          { type: string, title: "Sender JIDs who may start a run, comma separated; * = everyone" }
    owner:          { type: string }

steps:
  - id: plan
    name: Check the request against the live subscriptions
    description: Exit 0 go · 10 needs a person (rm, or everyone + auto) · 2 invalid.
    continue-on-error: true
    run: |
      cat > input.json <<'WFX_INPUT_EOF'
      {{ json .Input }}
      WFX_INPUT_EOF
      python3 ./subs.py plan
    timeout_sec: 60
    gates:
      - field: exitCode
        equals: 2
        action: fail
        message: "The subscription request is invalid — see stdout. Nothing was changed."
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }

  - id: approve
    name: A person approves
    description: Shown for rm, and for a subscription that lets everyone start an auto-replying workflow.
    needs: [plan]
    when:
      - path: plan.exitCode
        equals: 10
    requires_approval: true
    run: cat plan.json
    timeout_sec: 30
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }

  - id: apply
    name: Apply and read it back
    description: Calls the API, then reads the subscription back; ok only when the server shows the expected status.
    needs: [plan, approve]
    continue-on-error: true
    run: python3 ./subs.py apply
    timeout_sec: 60
    gates:
      - field: exitCode
        equals: 5
        action: fail
        message: "The subscription change did not take — see stdout for the API's answer."
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string, description: "the typed result" }
        stderr:   { type: string }
