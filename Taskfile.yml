version: "3"

dotenv: [".env"]

vars:
  BIN: "{{.ROOT_DIR}}/bin"
  # The version a binary reports comes from the tag, and from nowhere else. A
  # build off a tag reports the tag; anything else reports the commit, with
  # -dirty when the tree is modified — so a build can never claim to be a
  # release it is not. CI checks out with fetch-depth: 0 because a shallow
  # clone makes `git describe --tags` lie.
  VERSION: { sh: 'git describe --tags --always --dirty 2>/dev/null || echo dev' }
  COMMIT: { sh: 'git rev-parse --short HEAD 2>/dev/null || echo unknown' }
  DATE: { sh: 'date -u +%Y-%m-%dT%H:%M:%SZ' }
  # These land in internal/buildinfo and are what `wfx version` reports. A
  # binary built WITHOUT them (a plain `go build`, or `go install …@latest`)
  # still answers, from debug.ReadBuildInfo — so the flags improve the answer
  # rather than being required for one.
  LDFLAGS: >-
    -s -w
    -X github.com/muthuishere/wfnexus/apps/api/internal/buildinfo.Version={{.VERSION}}
    -X github.com/muthuishere/wfnexus/apps/api/internal/buildinfo.Commit={{.COMMIT}}
    -X github.com/muthuishere/wfnexus/apps/api/internal/buildinfo.Date={{.DATE}}

tasks:
  default:
    cmds: [task --list]

  # ---- run it ---------------------------------------------------------------
  infra:up:
    desc: Postgres (5460) + MinIO (9030 api, 9031 console)
    cmds: [docker compose up -d]
  infra:down:
    cmds: [docker compose down]
  infra:psql:
    desc: A psql shell on the platform database
    cmds: [docker exec -it bfp-postgres psql -U bfp -d bfp]

  api:
    desc: Run the server against infra:up's Postgres (migrations on boot)
    dir: apps/api
    # WFX_MODE=server is STATED here. The binary's no-config default is `local`
    # — sqlite in a file, artifacts in a folder — which is right for someone who
    # just downloaded it and wrong for a session that has just run
    # `task infra:up`. `server`'s defaults ARE that stack: postgres on 5460,
    # MinIO on 9030. A .env (see .env.example) still overrides both.
    env: { WFX_ROOT: "{{.ROOT_DIR}}", WFX_MODE: server }
    cmds: [go run .]
  ui:
    desc: Vite dev server on :5173, proxying /api to :8090
    dir: apps/ui
    cmds: [npm run dev]
  dev:
    desc: Everything a working session needs — infra, then the server
    deps: [infra:up]
    cmds: [task: api]

  # ---- what goes INSIDE the binary ------------------------------------------
  # The UI bundle and the default templates/skills/registries are compiled into
  # wfx-server by //go:embed, so a downloaded binary works with NOTHING beside
  # it. go:embed can only see files inside the package, so they are staged into
  # apps/api/internal/assets/embedded/ first — staged, never committed.
  #
  # Every task that produces a server binary depends on this one, and this one
  # depends on ui:build. That is what makes a stale or empty embedded UI
  # impossible: the bundle is rebuilt, and a missing dist FAILS the build
  # instead of quietly embedding nothing.
  assets:stage:
    desc: Build the UI and stage everything that gets embedded into wfx-server
    deps: [ui:build]
    vars:
      EMBED: "{{.ROOT_DIR}}/apps/api/internal/assets/embedded"
    cmds:
      - >-
        test -f apps/ui/dist/index.html ||
        (echo "FAIL: apps/ui/dist/index.html is missing — the UI did not build, and a binary without it would serve a 404 at /" && exit 1)
      - rm -rf {{.EMBED}}/ui {{.EMBED}}/templates {{.EMBED}}/skills {{.EMBED}}/registries.json
      - mkdir -p {{.EMBED}}/ui {{.EMBED}}/templates {{.EMBED}}/skills
      - cp -R apps/ui/dist/. {{.EMBED}}/ui/
      - cp -R templates/. {{.EMBED}}/templates/
      - cp -R skills/. {{.EMBED}}/skills/
      - cp registries.json {{.EMBED}}/registries.json
      - "echo \"staged: $(find {{.EMBED}} -type f | wc -l | tr -d ' ') files\""

  build:
    desc: All three binaries — wfx-server, wfx (CLI), wfx-runner (worker)
    cmds:
      - task: assets:stage
      - task: build:api
      - task: build:cli
      - task: build:runner
  build:api:
    deps: [assets:stage]
    dir: apps/api
    cmds: ['go build -ldflags="{{.LDFLAGS}}" -o {{.BIN}}/wfx-server .']
  e2e:
    desc: UI tests in jsdom against the built binary — sqlite, no postgres, no model, no browser
    deps: [build:api]
    dir: apps/ui
    cmds:
      - npm install --silent
      - npx vitest run

  build:cli:
    dir: apps/api
    cmds: ['go build -ldflags="{{.LDFLAGS}}" -o {{.BIN}}/wfx ./cmd/wfx']
  build:runner:
    dir: apps/api
    cmds: ['go build -ldflags="{{.LDFLAGS}}" -o {{.BIN}}/wfx-runner ./cmd/wfx-runner']
  # ---- release -------------------------------------------------------------
  release:
    desc: Every binary for every platform, plus the self-contained server tarball
    deps: [assets:stage]
    cmds:
      - task: release:binaries
      - task: release:tar
      - task: release:checksums

  release:binaries:
    desc: wfx-server, wfx and wfx-runner for linux, windows and macos
    deps: [assets:stage]
    dir: apps/api
    vars:
      TARGETS: linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/arm64 darwin/amd64
    cmds:
      - rm -rf {{.BIN}}/release && mkdir -p {{.BIN}}/release
      - for: { var: TARGETS }
        cmd: >-
          GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} CGO_ENABLED=0
          sh -c 'for c in "wfx-server:." "wfx:./cmd/wfx" "wfx-runner:./cmd/wfx-runner"; do
            name=${c%%:*}; pkg=${c#*:};
            ext=""; [ "$GOOS" = windows ] && ext=".exe";
            go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN}}/release/${name}-$GOOS-$GOARCH${ext} $pkg || exit 1;
          done'
      - "ls -1 {{.BIN}}/release"

  release:tar:
    desc: One self-contained tarball per Linux arch — docker compose, no registry, no Go
    # ONE TARBALL PER ARCHITECTURE. It used to copy linux/amd64 only while the
    # release built arm64 too, so the air-gapped install — the whole point of
    # this artifact — could not run on an arm64 machine. The architecture is
    # now chosen when the file is DOWNLOADED, never at `docker build` time on a
    # disconnected machine: inside every tarball the binaries carry the same
    # fixed names, so infra/package/Dockerfile stays architecture-blind.
    vars:
      ARCHES: amd64 arm64
    cmds:
      - for: { var: ARCHES }
        cmd: >-
          set -e;
          A={{.ITEM}}; P={{.BIN}}/pkg-$A;
          rm -rf $P && mkdir -p $P/bin $P/k8s $P/ui;
          cp {{.BIN}}/release/wfx-server-linux-$A $P/bin/wfx-server-linux;
          cp {{.BIN}}/release/wfx-linux-$A        $P/bin/wfx-linux;
          cp {{.BIN}}/release/wfx-runner-linux-$A $P/bin/wfx-runner-linux;
          cp -R apps/ui/dist/. $P/ui/;
          cp -R workflows templates skills registries.json $P/;
          cp -R infra/k8s/. $P/k8s/;
          cp infra/package/Dockerfile infra/package/Dockerfile.runner $P/;
          cp infra/package/docker-compose.yml infra/package/README.md infra/package/config.example.yaml $P/;
          tar -czf {{.BIN}}/release/wfx-server-linux-$A.tar.gz -C $P .;
          echo "wrote {{.BIN}}/release/wfx-server-linux-$A.tar.gz"

  release:checksums:
    desc: A SHA-256 for every published file, so a download can be verified offline
    # Every file in bin/release/ other than checksums.txt itself gets an entry.
    # The installer refuses to install anything whose digest is not in here, so
    # a file missing from this list is a broken install, not a soft warning.
    dir: "{{.BIN}}/release"
    cmds:
      - rm -f checksums.txt
      - "ls -1 | grep -v '^checksums.txt$' | xargs shasum -a 256 > checksums.txt"
      - cat checksums.txt

  build:runner:all:
    desc: The worker for every machine you might add — linux, mac, windows
    dir: apps/api
    cmds:
      - for: [linux/amd64, linux/arm64, darwin/arm64, darwin/amd64, windows/amd64, windows/arm64]
        cmd: >-
          GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} CGO_ENABLED=0
          go build -trimpath -ldflags="{{.LDFLAGS}}"
          -o {{.BIN}}/runner/wfx-runner-{{splitList "/" .ITEM | first}}-{{splitList "/" .ITEM | last}}{{if eq (splitList "/" .ITEM | first) "windows"}}.exe{{end}}
          ./cmd/wfx-runner
      - "ls -1 {{.BIN}}/runner"
  ui:build:
    dir: apps/ui
    cmds: [npm run build]
  install:
    desc: Put wfx on your PATH (~/.local/bin)
    deps: [build:cli]
    cmds:
      - mkdir -p ~/.local/bin
      - "cp {{.BIN}}/wfx ~/.local/bin/wfx"
      - "echo 'wfx installed — try: wfx workflows'"

  # ---- check ----------------------------------------------------------------
  check:
    desc: Everything CI would run
    cmds: [task: test, task: vet, task: build:all, task: ui:check, task: workflows:validate]
  test:
    dir: apps/api
    cmds: [go test ./internal/... ./cmd/...]
  test:race:
    desc: The concurrency paths — the planner and the scheduler run steps in parallel
    dir: apps/api
    cmds: [go test -race ./internal/engine/ ./internal/planner/]
  vet:
    dir: apps/api
    cmds:
      - go vet ./internal/... . ./cmd/...
      - gofmt -l internal cmd main.go
  ui:check:
    dir: apps/ui
    cmds:
      - npx tsc --noEmit -p tsconfig.app.json
      - npm run build
  workflows:validate:
    desc: Validate every workflow against the live registries
    # Starts its own server on an ephemeral port and stops it again. `wfx
    # validate` posts to the API on purpose — whether a provider, classifier,
    # skill or MCP server resolves is a property of the registries, not of the
    # file — which used to mean this target only passed when someone happened
    # to have `task api` running. CI found that on its first run.
    deps: [build:cli, build:api]
    cmds:
      - bash .github/scripts/validate-workflows.sh

  # ---- the knowledge graph --------------------------------------------------
  graph:
    desc: Rebuild the ctx-optimize store for this repo
    cmds: [ctx-optimize up]

  # ---- spikes ---------------------------------------------------------------
  spikes:
    desc: Verify unreleased toolnexus behaviour (needs the replace in go.work)
    dir: spikes
    cmds: [go test ./...]

  # ---- portability ----------------------------------------------------------
  build:all:
    desc: Cross-compile for every target we claim to support
    deps: [assets:stage]
    dir: apps/api
    cmds:
      - for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64; do
          GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null . || exit 1;
          GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/wfx || exit 1;
          echo "  ok $t";
        done
