name: cr-compacted
description: >-
  Review a branch or diff adversarially and produce findings a human can act on.
  Read-only by construction: no step is granted a tool that can change the code.

input_schema:
  type: object
  required: [repo_path, branch]
  properties:
    repo_path:   { type: string, title: "Local repo path" }
    branch:      { type: string, title: "Branch to review" }
    base_branch: { type: string, title: "Base branch", default: main }
    focus:       { type: string, title: "Anything to pay particular attention to", format: textarea }
    isolate:     { type: boolean, title: "Isolate in a git worktree", default: true }

steps:
  - id: survey
    name: Survey the change
    description: Establish what actually changed before judging it.
    soul: >-
      You describe a change before you have an opinion about it. You report what
      the diff does, not whether you like it.
    skills: [repo-navigator]
    tools: [bash, read, grep, glob]
    provider: haiku
    budget: { max_turns: 20, max_tool_calls: 60, max_wall_sec: 300, compact_at_tokens: 40000 }
    guardrails:
      - deny: "*"
        args_contain: ["git push", "git commit", "git checkout -b", "gh pr"]
        reason: this workflow reviews; it never changes the branch or publishes
    prompt: |
      Survey the change on `{{ .Input.branch }}` against `{{ .Input.base_branch }}`
      in the repository at {{ .WorkDir }}.

      Read the diff in full. Report what it does, which areas it touches, and how
      risky each area is. Do not review it yet. Then call submit_output.
    output_schema:
      type: object
      additionalProperties: false
      required: [summary, files_changed, areas, has_tests]
      properties:
        summary:       { type: string, description: "what this change does, in one paragraph" }
        files_changed: { type: array, items: { type: string } }
        areas:
          type: array
          description: "risk-bearing areas the change touches"
          items:
            type: object
            required: [area, risk]
            properties:
              area: { type: string }
              risk: { type: string, enum: [high, medium, low] }
        has_tests: { type: boolean, description: "does the change add or update tests" }

  - id: review
    name: Review
    description: Adversarial review against the surveyed change.
    soul: >-
      You are an adversarial reviewer who did not write this code. You verify
      claims by running them; a passing suite you did not watch pass is a rumour.
      You do not inflate severities to look thorough.
    skills: [change-reviewer, repo-navigator]
    tools: [bash, read, grep, glob]
    provider: haiku
    budget: { max_turns: 80, max_tokens: 600000, max_tool_calls: 250, max_wall_sec: 1800, compact_at_tokens: 40000 }
    guardrails:
      - deny: "*"
        args_contain: ["git push", "git commit", "gh pr", "git checkout -b"]
        reason: a reviewer records a verdict; it never changes the branch
      - deny: write
        reason: this step reviews the change and must not alter it
      - deny: edit
        reason: this step reviews the change and must not alter it
      - deny: apply_patch
        reason: this step reviews the change and must not alter it
    prompt: |
      Review the change on `{{ .Input.branch }}` against `{{ .Input.base_branch }}`.

      Survey from the previous step:
      {{ .Steps.survey.summary }}

      Files changed: {{ join .Steps.survey.files_changed ", " }}
      Tests included: {{ .Steps.survey.has_tests }}
      {{ if .Input.focus }}
      The requester asked you to pay particular attention to:
      {{ .Input.focus }}{{ end }}

      Load the `change-reviewer` skill and follow it. Run the suite yourself.

      Review breadth-first: read the whole diff before going deep on any hunk,
      and keep enough turns in hand to submit. A submitted review with three
      solid findings beats an unsubmitted one with ten.

      Then call submit_output.
    output_schema:
      type: object
      additionalProperties: false
      required: [verdict, findings, tests_run, reasoning]
      properties:
        verdict: { type: string, enum: [approve, approve_with_comments, request_changes] }
        findings:
          type: array
          items:
            type: object
            required: [severity, file, message]
            properties:
              severity: { type: string, enum: [blocker, major, minor, nit] }
              file:     { type: string }
              line:     { type: integer }
              message:  { type: string }
              suggestion: { type: string }
        tests_run: { type: boolean, description: "did you run the suite yourself" }
        test_summary: { type: string }
        reasoning: { type: string }
