# load-context — a shared building block, EMBEDDED (not started) by handlers.
#
# frontdesk pulls this in with `uses: [{use: load-context, as: ctx}]`: its step
# becomes `ctx.gather` inside the caller's own run, sharing its workspace and
# input. Embed when the steps are part of the caller's job; start (`start:`)
# when the work is a job of its own.
#
# It writes ./context.json — the event, the watch's instructions,
# skills and responsePolicy — so the caller's agent reads one file instead of
# a prompt full of templated, untrusted chat text.
name: load-context
template:
  title: Load context — the shared "what is this conversation" step
  category: debugging-ops
  summary: >-
    Writes context.json (event, chat, sender, the watch's instructions,
    skills and response policy) into the caller's workspace. Meant to be
    embedded with `uses:`, not run on its own.
  fill:
    - "nothing — copy it beside frontdesk"

description: >-
  Embedded building block: writes the conversation context (event, sender,
  watch instructions, skills, response policy) to context.json in the
  calling run's workspace.

on: workflow_call

# Typed interface (issue #82): a caller pins `use: load-context@1` and may pass
# `inputs: { default_policy: approval }`. Checked at load time; substituted for
# {{ .Inputs.<name> }} below before the run starts.
version: 1
inputs:
  default_policy:
    type: string
    enum: [draft, approval, auto, none]
    default: draft
    description: "responsePolicy used when the watch does not set one (draft — never auto-send)."
  out:
    type: string
    default: context.json
    description: file the context is written to, in the caller's workspace.
outputs:
  context:
    type: string
    description: the file named by `out`, holding the conversation context.

steps:
  - id: gather
    name: Write the conversation context
    description: context.json for the caller's agent; the chat text stays data in a file, never part of a command.
    run: |
      cat > input.json <<WFX_INPUT_EOF
      {{ .Input }}
      WFX_INPUT_EOF
      WFX_POLICY="{{ .Inputs.default_policy }}" WFX_OUT="{{ .Inputs.out }}" python3 - <<PY
      import json, os
      i = json.load(open("input.json"))
      m = i.get("message") or {}
      if not m and i.get("messages"):
          m = i["messages"][-1]
      s = i.get("watch") or {}
      ctx = {
          "chat": m.get("chat", ""), "chatName": m.get("chatName", ""), "chatType": m.get("chatType", ""),
          "from": m.get("from", ""), "name": m.get("name", ""), "messageId": m.get("id", ""),
          "kind": m.get("kind") or "message", "text": m.get("text", ""), "replyTo": m.get("replyTo"),
          "media": m.get("media"), "fromOwner": bool(m.get("fromOwner")),
          "watch": s.get("name", ""), "instructions": s.get("instructions", ""),
          "skills": s.get("skills") or [], "responsePolicy": s.get("responsePolicy") or os.environ["WFX_POLICY"],
      }
      json.dump(ctx, open(os.environ["WFX_OUT"], "w"), indent=2)
      print(f"context for {ctx['chat'] or '?'} from {ctx['from'] or '?'} ({ctx['kind']}), policy {ctx['responsePolicy']}")
      PY
    timeout_sec: 30
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }
