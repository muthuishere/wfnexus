{{- if .Values.runners.enabled }}
{{- $root := . -}}
{{- $fullname := include "wfnexus.fullname" . -}}
{{- if not .Values.runnerToken.existingSecret }}{{ fail "runners.enabled needs runnerToken.existingSecret (the same token the server holds)" }}{{ end -}}
{{- $url := .Values.runners.serverUrl | default (printf "http://%s.%s.svc.cluster.local:%v" $fullname .Release.Namespace .Values.service.port) -}}
{{- range .Values.runners.pools }}
{{- $img := merge (default dict .image) $root.Values.image.runner }}
---
# A worker is not a replica of the platform: it is a machine holding a
# toolchain. One Deployment per label set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-runner-{{ .name }}
  labels:
    {{- include "wfnexus.labels" $root | nindent 4 }}
    app.kubernetes.io/component: runner
    wfnexus.io/pool: {{ .name }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wfnexus.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: runner
      wfnexus.io/pool: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "wfnexus.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: runner
        wfnexus.io/pool: {{ .name }}
    spec:
      serviceAccountName: {{ include "wfnexus.serviceAccountName" $root }}
      automountServiceAccountToken: {{ $root.Values.serviceAccount.automountServiceAccountToken }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{ toYaml $root.Values.runners.podSecurityContext | nindent 8 }}
      containers:
        - name: runner
          image: "{{ $img.repository }}:{{ $img.tag | default $root.Chart.AppVersion }}"
          imagePullPolicy: {{ $img.pullPolicy }}
          securityContext: {{ toYaml $root.Values.runners.securityContext | nindent 12 }}
          env:
            - { name: WFX_URL, value: {{ $url | quote }} }
            - { name: WFX_LABELS, value: {{ .labels | quote }} }
            # Each pod joins under its own name; carry state follows it.
            - name: WFX_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: WFX_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $root.Values.runnerToken.existingSecret }}, key: {{ $root.Values.runnerToken.key }} } }
            {{- include "wfnexus.carryEnv" (dict "root" $root "server" false) | nindent 12 }}
            {{- with .extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          volumeMounts:
            - { name: work, mountPath: /home/wfx/.wfx-runner }
            {{- if and $root.Values.carry.enabled $root.Values.carry.keyFileSecret }}
            - { name: carry-key, mountPath: /etc/carry, readOnly: true }
            {{- end }}
          resources: {{ toYaml (.resources | default dict) | nindent 12 }}
      volumes:
        - name: work
          emptyDir: {}   # checkouts are a cache; losing them costs a clone
        {{- if and $root.Values.carry.enabled $root.Values.carry.keyFileSecret }}
        - name: carry-key
          secret: { secretName: {{ $root.Values.carry.keyFileSecret }}, defaultMode: 0400 }
        {{- end }}
      {{- with .nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
