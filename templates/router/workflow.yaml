# router — ROUTES, and does nothing else. Not WhatsApp-specific.
#
# An event comes in (a chat message, a webhook body, a workflow.completed); one
# step classifies it against routes.json, one `start:` step starts the workflow
# that owns it as its own run, with this run recorded as the parent. No reply,
# no side effect, no model: if routing needs judgement, put a `judge:` step in
# front of `classify` and route on its answer — the start step stays the same.
#
# Route vs embed: this workflow STARTS the handler (`start:`), so the handler
# is its own run with its own memory, history and failure. frontdesk shows the
# other way, EMBEDDING a shared workflow's steps with `uses:`.
#
# The 7-point bar:
#   trigger        a subscription in observe/fanout mode, a hook, or `start:` from a monitor
#   system of record  routes.json (versioned beside the workflow) + the parent/child run links
#   typed output   the start step's {runId, workflow, status}
#   verification   the child run id is recorded; an unknown target fails the run, never drops
#   human gate     none needed — routing changes nothing; the handlers carry their own gates
#   no silent failure  a broken routes.json fails the run; "no route" is an explicit skipped outcome
#   success number    share of events that found a route (outcome ok vs skipped), per week
name: router
template:
  title: Router — classify an event and start the workflow that owns it
  category: debugging-ops
  summary: >-
    One rule table (routes.json), first match wins, and a `start:` step that
    starts the matched workflow as its own run. The generic front door for
    events from chats, hooks and other workflows.
  fill:
    - "routes.json: one rule per workflow — kind, chatType, chat, source, fromOwner and a `text` regex; the last rule is the fallback"
    - "every workflow routes.json names must exist in the project (pingpong, frontdesk, …)"

description: >-
  Classifies one event against a rule table and starts the workflow that owns
  it as an independent child run. Routes only: it never replies or changes
  anything itself.

on: [workflow_dispatch, workflow_call]

memory:
  scope: workflow

input_schema:
  type: object
  required: [event]
  properties:
    event:
      type: object
      title: "The event (e.g. a WhatsApp message: chat, from, text, kind…)"
    subscription:
      type: object
      title: "The subscription that delivered it, passed through to the handler"
      default: {}

steps:
  - id: classify
    name: Classify the event
    description: First matching rule in routes.json; prints the workflow name. Exit 3 = no route, 2 = broken rule table.
    continue-on-error: true
    run: |
      cat > input.json <<'WFX_INPUT_EOF'
      {{ json .Input }}
      WFX_INPUT_EOF
      python3 ./classify.py
    timeout_sec: 30
    gates:
      - field: exitCode
        equals: 2
        action: fail
        message: "routes.json is broken — see stdout. No event was routed."
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string, description: "the workflow to start" }
        stderr:   { type: string }

  - id: route
    name: Start the workflow that owns it
    description: An independent child run; the event goes through with its type intact.
    needs: [classify]
    when:
      - path: classify.exitCode
        equals: 0
    start:
      workflow: "{{ .Steps.classify.stdout }}"
      input:
        message: "{{ json .Input.event }}"
        subscription: "{{ json .Input.subscription }}"
