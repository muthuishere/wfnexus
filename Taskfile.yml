version: "3"

dotenv: [".env"]

vars:
  BIN: "{{.ROOT_DIR}}/bin"

tasks:
  default:
    cmds: [task --list]

  # ---- run it ---------------------------------------------------------------
  infra:up:
    desc: Postgres (5460) + MinIO (9030 api, 9031 console)
    cmds: [docker compose up -d]
  infra:down:
    cmds: [docker compose down]
  infra:psql:
    desc: A psql shell on the platform database
    cmds: [docker exec -it bfp-postgres psql -U bfp -d bfp]

  api:
    desc: Run the server (applies migrations on boot)
    dir: apps/api
    env: { WFX_ROOT: "{{.ROOT_DIR}}" }
    cmds: [go run .]
  ui:
    desc: Vite dev server on :5173, proxying /api to :8090
    dir: apps/ui
    cmds: [npm run dev]
  dev:
    desc: Everything a working session needs — infra, then the server
    deps: [infra:up]
    cmds: [task: api]

  # ---- what goes INSIDE the binary ------------------------------------------
  # The UI bundle and the default templates/skills/registries are compiled into
  # wfx-server by //go:embed, so a downloaded binary works with NOTHING beside
  # it. go:embed can only see files inside the package, so they are staged into
  # apps/api/internal/assets/embedded/ first — staged, never committed.
  #
  # Every task that produces a server binary depends on this one, and this one
  # depends on ui:build. That is what makes a stale or empty embedded UI
  # impossible: the bundle is rebuilt, and a missing dist FAILS the build
  # instead of quietly embedding nothing.
  assets:stage:
    desc: Build the UI and stage everything that gets embedded into wfx-server
    deps: [ui:build]
    vars:
      EMBED: "{{.ROOT_DIR}}/apps/api/internal/assets/embedded"
    cmds:
      - >-
        test -f apps/ui/dist/index.html ||
        (echo "FAIL: apps/ui/dist/index.html is missing — the UI did not build, and a binary without it would serve a 404 at /" && exit 1)
      - rm -rf {{.EMBED}}/ui {{.EMBED}}/templates {{.EMBED}}/skills {{.EMBED}}/registries.json
      - mkdir -p {{.EMBED}}/ui {{.EMBED}}/templates {{.EMBED}}/skills
      - cp -R apps/ui/dist/. {{.EMBED}}/ui/
      - cp -R templates/. {{.EMBED}}/templates/
      - cp -R skills/. {{.EMBED}}/skills/
      - cp registries.json {{.EMBED}}/registries.json
      - "echo \"staged: $(find {{.EMBED}} -type f | wc -l | tr -d ' ') files\""

  build:
    desc: All three binaries — wfx-server, wfx (CLI), wfx-runner (worker)
    cmds:
      - task: assets:stage
      - task: build:api
      - task: build:cli
      - task: build:runner
  build:api:
    deps: [assets:stage]
    dir: apps/api
    cmds: ["go build -o {{.BIN}}/wfx-server ."]
  build:cli:
    dir: apps/api
    cmds: ["go build -o {{.BIN}}/wfx ./cmd/wfx"]
  build:runner:
    dir: apps/api
    cmds: ["go build -o {{.BIN}}/wfx-runner ./cmd/wfx-runner"]
  # ---- release -------------------------------------------------------------
  release:
    desc: Every binary for every platform, plus the self-contained server tarball
    deps: [assets:stage]
    cmds:
      - task: release:binaries
      - task: release:tar

  release:binaries:
    desc: wfx-server, wfx and wfx-runner for linux, windows and macos
    deps: [assets:stage]
    dir: apps/api
    vars:
      TARGETS: linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/arm64 darwin/amd64
    cmds:
      - rm -rf {{.BIN}}/release && mkdir -p {{.BIN}}/release
      - for: { var: TARGETS }
        cmd: >-
          GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} CGO_ENABLED=0
          sh -c 'for c in "wfx-server:." "wfx:./cmd/wfx" "wfx-runner:./cmd/wfx-runner"; do
            name=${c%%:*}; pkg=${c#*:};
            ext=""; [ "$GOOS" = windows ] && ext=".exe";
            go build -trimpath -ldflags="-s -w" -o {{.BIN}}/release/${name}-$GOOS-$GOARCH${ext} $pkg || exit 1;
          done'
      - "ls -1 {{.BIN}}/release"

  release:tar:
    desc: A tarball docker compose can run with no registry and no Go toolchain
    cmds:
      - rm -rf {{.BIN}}/pkg && mkdir -p {{.BIN}}/pkg/bin {{.BIN}}/pkg/k8s {{.BIN}}/pkg/ui
      # The linux binaries travel WITH the tar, and the Dockerfile inside copies
      # them — so `docker compose up` needs no registry to pull from and no Go
      # on the machine. That is the difference between a tarball someone can use
      # and one that only works if they can reach your registry.
      - cp {{.BIN}}/release/wfx-server-linux-amd64 {{.BIN}}/release/wfx-linux-amd64 {{.BIN}}/pkg/bin/
      - cp {{.BIN}}/release/wfx-runner-linux-amd64 {{.BIN}}/pkg/bin/
      - cp -R apps/ui/dist/. {{.BIN}}/pkg/ui/
      - cp -R workflows templates skills registries.json {{.BIN}}/pkg/
      - cp -R infra/k8s/. {{.BIN}}/pkg/k8s/
      # The package has its OWN compose and Dockerfiles: the repository's build
      # from source, these copy the binary that is already in the tarball.
      - cp infra/package/Dockerfile infra/package/Dockerfile.runner {{.BIN}}/pkg/
      - cp infra/package/docker-compose.yml infra/package/README.md infra/package/config.example.yaml {{.BIN}}/pkg/
      - "tar -czf {{.BIN}}/wfx-server.tar.gz -C {{.BIN}}/pkg ."
      - "echo 'wrote {{.BIN}}/wfx-server.tar.gz' && tar -tzf {{.BIN}}/wfx-server.tar.gz | head -20"

  build:runner:all:
    desc: The worker for every machine you might add — linux, mac, windows
    dir: apps/api
    cmds:
      - for: [linux/amd64, linux/arm64, darwin/arm64, darwin/amd64, windows/amd64, windows/arm64]
        cmd: >-
          GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}} CGO_ENABLED=0
          go build -trimpath -ldflags="-s -w"
          -o {{.BIN}}/runner/wfx-runner-{{splitList "/" .ITEM | first}}-{{splitList "/" .ITEM | last}}{{if eq (splitList "/" .ITEM | first) "windows"}}.exe{{end}}
          ./cmd/wfx-runner
      - "ls -1 {{.BIN}}/runner"
  ui:build:
    dir: apps/ui
    cmds: [npm run build]
  install:
    desc: Put wfx on your PATH (~/.local/bin)
    deps: [build:cli]
    cmds:
      - mkdir -p ~/.local/bin
      - "cp {{.BIN}}/wfx ~/.local/bin/wfx"
      - "echo 'wfx installed — try: wfx workflows'"

  # ---- check ----------------------------------------------------------------
  check:
    desc: Everything CI would run
    cmds: [task: test, task: vet, task: build:all, task: ui:check, task: workflows:validate]
  test:
    dir: apps/api
    cmds: [go test ./internal/... ./cmd/...]
  test:race:
    desc: The concurrency paths — the planner and the scheduler run steps in parallel
    dir: apps/api
    cmds: [go test -race ./internal/engine/ ./internal/planner/]
  vet:
    dir: apps/api
    cmds:
      - go vet ./internal/... . ./cmd/...
      - gofmt -l internal cmd main.go
  ui:check:
    dir: apps/ui
    cmds:
      - npx tsc --noEmit -p tsconfig.app.json
      - npm run build
  workflows:validate:
    desc: Validate every workflow against the live registries
    deps: [build:cli]
    cmds:
      - for: { var: FILES }
        cmd: "{{.BIN}}/wfx validate {{.ITEM}}"
    vars:
      FILES:
        sh: ls workflows/*.yaml

  # ---- the knowledge graph --------------------------------------------------
  graph:
    desc: Rebuild the ctx-optimize store for this repo
    cmds: [ctx-optimize up]

  # ---- spikes ---------------------------------------------------------------
  spikes:
    desc: Verify unreleased toolnexus behaviour (needs the replace in go.work)
    dir: spikes
    cmds: [go test ./...]

  # ---- portability ----------------------------------------------------------
  build:all:
    desc: Cross-compile for every target we claim to support
    deps: [assets:stage]
    dir: apps/api
    cmds:
      - for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64; do
          GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null . || exit 1;
          GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/wfx || exit 1;
          echo "  ok $t";
        done
