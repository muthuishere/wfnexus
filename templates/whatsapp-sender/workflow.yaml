# whatsapp-sender — the ONE way a workflow says something on WhatsApp (ADR 0026).
#
# The mirror of whatsapp-monitor: text, quote-reply, attachment/voice/sticker,
# reaction, and edit/delete of our own message. Every other default workflow
# (pingpong, frontdesk, whatsapp-monitor's alert) sends through this one with
# `start: {workflow: whatsapp-sender, wait: true}`, so the policy, the dedup
# and the "never resend uncertain" rule live in one place.
#
# The 7-point bar:
#   trigger        `start:` from a handler, a hook, an MCP tool call, or a person
#   system of record  the server's send dedup (key claimed before the adapter runs) + the adapter's echo ledger
#   typed output   {status: sent|drafted|skipped|already, id, action, chat, key}; failed/uncertain fail the run
#   verification   `sent` only on the adapter's confirmation; anything else is failed or uncertain
#
# Every op (text, reply, attachment, reaction, edit, delete) is ONE `send:`
# step on the channel contract, so the channel's sendGap paces every op and
# the adapter's echo ledger sees every message we post (issue #86).
#   human gate     responsePolicy approval pauses before the send; draft never sends
#   no silent failure  failed/uncertain fail the run with the reason; uncertain is NEVER resent
#   success number    sent / (sent + failed + uncertain) per week, from the run history
name: whatsapp-sender
template:
  title: WhatsApp sender — one send, policy-checked, never duplicated
  category: debugging-ops
  summary: >-
    Sends text, a quote-reply, an attachment, a reaction, or edits/deletes our
    own message, after applying the caller's responsePolicy
    (draft, approval, auto, none). Reports sent, failed or uncertain, and never
    resends an uncertain send.
  fill:
    - "the server's default channel (channels.default / WFX_DEFAULT_CHANNEL) must be the WhatsApp channel — every op goes through it, so its sendGap and echo ledger apply"
    - "an attachment path must be inside this run's workspace (the send step refuses anything else)"

description: >-
  Sends one WhatsApp message (text, reply, attachment, reaction, edit or delete)
  after applying the response policy: draft stores it, approval waits for a
  person, auto sends, none skips. Answers sent, failed or uncertain; an
  uncertain send is never repeated.

on: [workflow_dispatch, workflow_call]

memory:
  scope: workflow

input_schema:
  type: object
  required: [chat]
  properties:
    chat:           { type: string, title: "Chat JID (DM or group)" }
    text:           { type: string, title: "Text (the new text for an edit)" }
    replyTo:        { type: string, title: "Message id to quote-reply to" }
    replyToSender:  { type: string, title: "Sender JID of the quoted/reacted message (groups)" }
    mentions:       { type: string, title: "JIDs to @mention, comma separated" }
    media:          { type: string, title: "Local path of an attachment" }
    mediaKind:      { type: string, enum: [file, image, voice, sticker], default: file }
    reaction:       { type: string, title: "Emoji to react with (empty removes)" }
    reactTo:        { type: string, title: "Message id to react to" }
    edit:           { type: string, title: "Id of OUR message to edit" }
    delete:         { type: string, title: "Id of OUR message to delete" }
    responsePolicy: { type: string, enum: [draft, approval, auto, none], default: draft }
    key:            { type: string, title: "Idempotency key (default: hash of the request)" }

steps:
  - id: plan
    name: Apply the response policy
    description: Validates the request, picks the one op, and derives the idempotency key.
    continue-on-error: true
    run: |
      cat > input.json <<'WFX_INPUT_EOF'
      {{ json .Input }}
      WFX_INPUT_EOF
      python3 ./sender.py plan
    timeout_sec: 30
    gates:
      - field: exitCode
        equals: 2
        action: fail
        message: "The send request is invalid — see stdout."
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string, description: "the planned op as JSON" }
        stderr:   { type: string }

  - id: policy
    name: Does a person approve first?
    description: Exits 10 when the responsePolicy is approval.
    needs: [plan]
    when:
      - path: plan.exitCode
        equals: 0
    continue-on-error: true
    run: python3 ./sender.py policy
    timeout_sec: 30
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }

  - id: approve
    name: A person approves this send
    description: Only for responsePolicy approval. The run pauses here; the approval card shows what will be sent.
    needs: [policy]
    when:
      - path: policy.exitCode
        equals: 10
    requires_approval: true
    run: python3 -c "import json; p=json.load(open('plan.json')); print(p['action'], 'to', p['chat']); print(p.get('text',''))"
    timeout_sec: 30
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }

  - id: send
    name: Send on the channel
    description: One op through the channel contract — paced by the channel's sendGap, claimed once by key, never retried; a refused send fails the run, an unconfirmed one fails it and keeps the key.
    needs: [plan, approve]
    when:
      - path: plan.exitCode
        equals: 0
    send:
      target: "{{ (fromJson .Steps.plan.stdout).chat }}"
      text: "{{ (fromJson .Steps.plan.stdout).text }}"
      attachment: "{{ (fromJson .Steps.plan.stdout).media }}"
      attachment_kind: "{{ (fromJson .Steps.plan.stdout).mediaKind }}"
      reply_to: "{{ (fromJson .Steps.plan.stdout).replyTo }}"
      reply_to_sender: "{{ (fromJson .Steps.plan.stdout).replyToSender }}"
      mentions: "{{ (fromJson .Steps.plan.stdout).mentions }}"
      reaction:
        target: "{{ (fromJson .Steps.plan.stdout).reactTo }}"
        emoji: "{{ (fromJson .Steps.plan.stdout).reaction }}"
        sender: "{{ (fromJson .Steps.plan.stdout).replyToSender }}"
      edit: "{{ (fromJson .Steps.plan.stdout).edit }}"
      delete: "{{ (fromJson .Steps.plan.stdout).delete }}"
      dedup:
        key: "{{ (fromJson .Steps.plan.stdout).key }}"

  - id: deliver
    name: Report the result
    description: Prints the typed result — sent, drafted, skipped, or already (this key was sent or may have been).
    needs: [plan, send]
    run: |
      cat > sent.json <<'WFX_SENT_EOF'
      {{ json .Steps.send }}
      WFX_SENT_EOF
      python3 ./sender.py deliver
    timeout_sec: 30
    state:
      workflow:
        last_send: "{{ .Output.stdout }}"
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string, description: "the typed result: {status, id, action, chat, key}" }
        stderr:   { type: string }
