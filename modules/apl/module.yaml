          cat > in.out <<'WFX_V'
          {{ .Inputs.out }}
          WFX_V
          cat > in.handle <<'WFX_V'
          {{ .Inputs.handle }}
          WFX_V
          cat > in.profile <<'WFX_V'
          {{ .Inputs.profile }}
          WFX_V
