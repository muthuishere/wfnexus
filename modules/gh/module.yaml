# gh — GitHub through the gh CLI, as module commands (#109).
#
#   wfx module profile set gh work --account me --input repo=owner/name --default
#   wfx module call gh.pr-list --wait
#   wfx module call gh.issue-comment --input number=12 --input body=… --input responsePolicy=auto --wait
#
# In a workflow:
#   - id: note
#     uses: gh.pr-comment@0
#     with: { number: "{{ .Input.pr }}", body: "checks are green", responsePolicy: approval }
#
# Writes (issue-create, issue-comment, pr-comment, api with a method other than
# GET) default to draft: nothing is written without a policy. gh uses its own
# login on the machine that runs the step.
name: gh
version: 0.1.0
description: GitHub via the gh CLI — issues, PR comments and lists, checks, releases, and the API.
requires:
  env: []
  cli:
    - name: gh
      check: gh --version
      install: curl -fsSL https://raw.githubusercontent.com/muthuishere/wfnexus/main/apps/api/cmd/wfx/core-clis.sh | sh -s -- gh

commands:

  issue-create:
    effect: write
    description: "Open an issue after the response policy \u2014 default draft writes nothing."
    inputs:
      title: { type: string, required: true }
      body: { type: string, default: "" }
      repo: { type: string, default: "", description: "owner/name (default: the profile's repo)" }
      profile: { type: string, default: "", description: "profile (default: the module's default profile)" }
      responsePolicy: { type: string, default: "draft", description: "draft | approval | auto | none (default draft: does nothing)" }
    steps:
      - id: plan
        name: Apply the response policy
        description: Exit 0 auto, 10 a person approves first, 11 draft, 12 none, 2 invalid.
        continue-on-error: true
        run: |
          printf '%s\n' "{{ .Inputs.title }}" > in.title
          printf '%s\n' "{{ .Inputs.body }}" > in.body
          printf '%s\n' "{{ .Inputs.repo }}" > in.repo
          printf '%s\n' "{{ .Inputs.profile }}" > in.profile
          printf '%s\n' "{{ .Inputs.responsePolicy }}" > in.responsePolicy
          python3 "$WFX_MODULE_DIR/gh_cmd.py" plan issue-create
        timeout_sec: 30
        gates:
          - { field: exitCode, equals: 2, action: fail, message: "invalid request — see stdout" }
      - id: approve
        name: A person approves
        needs: [plan]
        when:
          - { path: plan.exitCode, equals: 10 }
        requires_approval: true
        run: cat in.* 2>/dev/null | head -50
        timeout_sec: 30
      - id: act
        name: "Do it through gh"
        needs: [plan, approve]
        timeout_sec: 180
        run: python3 "$WFX_MODULE_DIR/gh_cmd.py" act issue-create
  issue-comment:
    effect: write
    description: "Comment on an issue after the response policy \u2014 default draft writes nothing."
    inputs:
      number: { type: string, required: true }
      body: { type: string, required: true }
      repo: { type: string, default: "" }
      profile: { type: string, default: "", description: "profile (default: the module's default profile)" }
      responsePolicy: { type: string, default: "draft", description: "draft | approval | auto | none (default draft: does nothing)" }
    steps:
      - id: plan
        name: Apply the response policy
        description: Exit 0 auto, 10 a person approves first, 11 draft, 12 none, 2 invalid.
        continue-on-error: true
        run: |
          printf '%s\n' "{{ .Inputs.number }}" > in.number
          printf '%s\n' "{{ .Inputs.body }}" > in.body
          printf '%s\n' "{{ .Inputs.repo }}" > in.repo
          printf '%s\n' "{{ .Inputs.profile }}" > in.profile
          printf '%s\n' "{{ .Inputs.responsePolicy }}" > in.responsePolicy
          python3 "$WFX_MODULE_DIR/gh_cmd.py" plan issue-comment
        timeout_sec: 30
        gates:
          - { field: exitCode, equals: 2, action: fail, message: "invalid request — see stdout" }
      - id: approve
        name: A person approves
        needs: [plan]
        when:
          - { path: plan.exitCode, equals: 10 }
        requires_approval: true
        run: cat in.* 2>/dev/null | head -50
        timeout_sec: 30
      - id: act
        name: "Do it through gh"
        needs: [plan, approve]
        timeout_sec: 180
        run: python3 "$WFX_MODULE_DIR/gh_cmd.py" act issue-comment
  pr-comment:
    effect: write
    description: "Comment on a pull request after the response policy \u2014 default draft writes nothing."
    inputs:
      number: { type: string, required: true }
      body: { type: string, required: true }
      repo: { type: string, default: "" }
      profile: { type: string, default: "", description: "profile (default: the module's default profile)" }
      responsePolicy: { type: string, default: "draft", description: "draft | approval | auto | none (default draft: does nothing)" }
    steps:
      - id: plan
        name: Apply the response policy
        description: Exit 0 auto, 10 a person approves first, 11 draft, 12 none, 2 invalid.
        continue-on-error: true
        run: |
          printf '%s\n' "{{ .Inputs.number }}" > in.number
          printf '%s\n' "{{ .Inputs.body }}" > in.body
          printf '%s\n' "{{ .Inputs.repo }}" > in.repo
          printf '%s\n' "{{ .Inputs.profile }}" > in.profile
          printf '%s\n' "{{ .Inputs.responsePolicy }}" > in.responsePolicy
          python3 "$WFX_MODULE_DIR/gh_cmd.py" plan pr-comment
        timeout_sec: 30
        gates:
          - { field: exitCode, equals: 2, action: fail, message: "invalid request — see stdout" }
      - id: approve
        name: A person approves
        needs: [plan]
        when:
          - { path: plan.exitCode, equals: 10 }
        requires_approval: true
        run: cat in.* 2>/dev/null | head -50
        timeout_sec: 30
      - id: act
        name: "Do it through gh"
        needs: [plan, approve]
        timeout_sec: 180
        run: python3 "$WFX_MODULE_DIR/gh_cmd.py" act pr-comment
  pr-list:
    description: "List pull requests."
    inputs:
      state: { type: string, default: "open" }
      limit: { type: string, default: "20" }
      repo: { type: string, default: "" }
      profile: { type: string, default: "", description: "profile (default: the module's default profile)" }
    steps:
      - id: act
        name: "Through gh"
        timeout_sec: 180
        run: |
          printf '%s\n' "{{ .Inputs.state }}" > in.state
          printf '%s\n' "{{ .Inputs.limit }}" > in.limit
          printf '%s\n' "{{ .Inputs.repo }}" > in.repo
          printf '%s\n' "{{ .Inputs.profile }}" > in.profile
          python3 "$WFX_MODULE_DIR/gh_cmd.py" act pr-list
  checks:
    description: "A pull request's checks."
    inputs:
      number: { type: string, required: true }
      repo: { type: string, default: "" }
      profile: { type: string, default: "", description: "profile (default: the module's default profile)" }
    steps:
      - id: act
        name: "Through gh"
        timeout_sec: 180
        run: |
          printf '%s\n' "{{ .Inputs.number }}" > in.number
          printf '%s\n' "{{ .Inputs.repo }}" > in.repo
          printf '%s\n' "{{ .Inputs.profile }}" > in.profile
          python3 "$WFX_MODULE_DIR/gh_cmd.py" act checks
  release-list:
    description: "List releases."
    inputs:
      limit: { type: string, default: "10" }
      repo: { type: string, default: "" }
      profile: { type: string, default: "", description: "profile (default: the module's default profile)" }
    steps:
      - id: act
        name: "Through gh"
        timeout_sec: 180
        run: |
          printf '%s\n' "{{ .Inputs.limit }}" > in.limit
          printf '%s\n' "{{ .Inputs.repo }}" > in.repo
          printf '%s\n' "{{ .Inputs.profile }}" > in.profile
          python3 "$WFX_MODULE_DIR/gh_cmd.py" act release-list
  api:
    description: "Read the GitHub API (gh api, GET only). Any other method is refused (exit 2): use gh.api-write."
    inputs:
      path: { type: string, required: true, description: "e.g. repos/{repo}/issues \u2014 {repo} is the repo input/profile" }
      method: { type: string, default: "GET", description: "GET only" }
      repo: { type: string, default: "" }
      profile: { type: string, default: "", description: "profile (default: the module's default profile)" }
    steps:
      - id: act
        name: "Read through gh"
        timeout_sec: 180
        run: |
          printf '%s\n' "{{ .Inputs.path }}" > in.path
          printf '%s\n' "{{ .Inputs.method }}" > in.method
          printf '%s\n' "{{ .Inputs.repo }}" > in.repo
          printf '%s\n' "{{ .Inputs.profile }}" > in.profile
          python3 "$WFX_MODULE_DIR/gh_cmd.py" act api
        gates:
          - { field: exitCode, equals: 2, action: fail, message: "invalid request — see stdout" }

  api-write:
    effect: write
    description: "Write through the GitHub API (gh api with POST, PATCH, PUT or DELETE). Pauses for approval, then the response policy."
    inputs:
      path: { type: string, required: true, description: "e.g. repos/{repo}/issues \u2014 {repo} is the repo input/profile" }
      method: { type: string, required: true, description: "POST, PATCH, PUT or DELETE (not GET)" }
      body: { type: string, default: "", description: "JSON body" }
      repo: { type: string, default: "" }
      profile: { type: string, default: "", description: "profile (default: the module's default profile)" }
      responsePolicy: { type: string, default: "draft", description: "draft | approval | auto | none (default draft: does nothing)" }
    steps:
      - id: plan
        name: Apply the response policy
        description: Exit 0 auto, 10 a person approves first, 11 draft, 12 none, 2 invalid.
        continue-on-error: true
        run: |
          printf '%s\n' "{{ .Inputs.path }}" > in.path
          printf '%s\n' "{{ .Inputs.method }}" > in.method
          printf '%s\n' "{{ .Inputs.body }}" > in.body
          printf '%s\n' "{{ .Inputs.repo }}" > in.repo
          printf '%s\n' "{{ .Inputs.profile }}" > in.profile
          printf '%s\n' "{{ .Inputs.responsePolicy }}" > in.responsePolicy
          python3 "$WFX_MODULE_DIR/gh_cmd.py" plan api-write
        timeout_sec: 30
        gates:
          - { field: exitCode, equals: 2, action: fail, message: "invalid request — see stdout" }
      - id: approve
        name: A person approves
        needs: [plan]
        when:
          - { path: plan.exitCode, equals: 10 }
        requires_approval: true
        run: cat in.* 2>/dev/null | head -50
        timeout_sec: 30
      - id: act
        name: "Do it through gh"
        needs: [plan, approve]
        timeout_sec: 180
        run: python3 "$WFX_MODULE_DIR/gh_cmd.py" act api-write
