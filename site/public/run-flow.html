<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>How a wfnexus run flows</title>
<style>
  html,body{margin:0;height:100%;background:#f4f3ef;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #fps{position:fixed;right:10px;bottom:8px;font:11px ui-monospace,Menlo,monospace;
       color:#c2beb4;letter-spacing:.04em;user-select:none}
</style>
<style>#fps,.fps{display:none!important}</style></head>
<body>
<canvas id="c"></canvas><div id="fps"></div>
<script id="data" type="application/json">{"title":"How a wfnexus run flows","subtitle":["A person or an agent asks; wfx-server runs typed steps; a human gates; git keeps the receipt."],"chips":["internal/engine","internal/catalog","internal/proposal","internal/devinadapter","internal/judge"],"footnote":"Package names checked against apps/api/internal by site/scripts/verify-symbols.mjs.","nodes":[{"id":"who","title":"Agent","detail":"or a person","kind":"card","num":"01","x":62,"y":520.61,"w":162.79,"h":100.78},{"id":"cli","title":"wfx CLI","detail":"or the UI","kind":"card","num":"02","x":316.27,"y":520.61,"w":162.79,"h":100.78},{"id":"server","title":"wfx-server","detail":"engine · catalog · proposal","kind":"hub","x":570.54,"y":468.67,"w":204.66,"h":204.66},{"id":"judge","title":"Classifier","detail":"TypeSafe jev","kind":"card","num":"03","x":866.67,"y":426.81,"w":162.79,"h":100.78},{"id":"providers","title":"Providers","detail":"http · cli · acp","kind":"loop","num":"04","pills":["devin","opencode","codex"],"x":872.09,"y":563.25,"w":151.94,"h":151.94},{"id":"gate","title":"Gate","detail":"a human approves","kind":"card","num":"05","x":1120.94,"y":520.61,"w":162.79,"h":100.78},{"id":"git","title":"git","detail":"branch + PR","kind":"card","num":"06","x":1375.21,"y":520.61,"w":162.79,"h":100.78}],"edges":[{"label":"ASKS","x0":224.79,"y0":571,"x1":316.27,"y1":571,"bend":0,"labelX":270.53,"labelY":593,"dots":2},{"label":"RUN","x0":479.06,"y0":571,"x1":570.54,"y1":571,"bend":0,"labelX":524.8,"labelY":593,"dots":2},{"label":"STEPS","x0":775.19,"y0":571,"x1":872.09,"y1":639.22,"bend":0.16,"labelX":805.52,"labelY":630.85,"dots":2},{"label":"DECIDE","x0":775.19,"y0":571,"x1":866.67,"y1":477.2,"bend":-0.16,"labelX":829.18,"labelY":532.14,"dots":2},{"label":"TYPED OUTPUT","x0":1024.04,"y0":639.22,"x1":1120.94,"y1":571,"bend":0.16,"labelX":1090.61,"labelY":630.85,"dots":2},{"label":"UNCERTAIN","x0":1029.46,"y0":477.2,"x1":1120.94,"y1":571,"bend":-0.16,"labelX":1066.95,"labelY":532.14,"dots":2},{"label":"APPROVED","x0":1283.73,"y0":571,"x1":1375.21,"y1":571,"bend":0,"labelX":1329.47,"labelY":593,"dots":2}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const VW=1600, VH=1000;
const INK="#1c1b19", MUTED="#8a857c", HAIR="#d6d2c8", ACC="#7c3aed", DOTC="109,40,217";
const SANS='-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif';
const MONO='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';

const cv=document.getElementById("c"), ctx=cv.getContext("2d",{alpha:false});
let SC=1,OX=0,OY=0;
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2), w=innerWidth, h=innerHeight;
  cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr);
  SC=Math.min(w/VW,h/VH); OX=(w-VW*SC)/2; OY=(h-VH*SC)/2;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize); resize();

const S=v=>v*SC, TX=x=>OX+x*SC, TY=y=>OY+y*SC;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
 ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
 ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
 ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
 ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function txt(s,x,y,o){o=o||{};
  const size=o.size||14, weight=o.weight||400, font=o.font||SANS;
  ctx.font=`${weight} ${S(size)}px ${font}`;
  ctx.fillStyle=o.color||INK; ctx.textAlign=o.align||"left"; ctx.textBaseline="alphabetic";
  if(o.spacing){
    let total=0; for(const ch of s) total+=ctx.measureText(ch).width+S(o.spacing);
    total-=S(o.spacing);
    let cx=TX(x); if(o.align==="center")cx-=total/2; if(o.align==="right")cx-=total;
    ctx.textAlign="left";
    for(const ch of s){ctx.fillText(ch,cx,TY(y));cx+=ctx.measureText(ch).width+S(o.spacing);}
  } else ctx.fillText(s,TX(x),TY(y));
}


function clip(s,size,weight,maxW){
  ctx.font=`${weight} ${S(size)}px ${SANS}`;
  if(ctx.measureText(s).width<=S(maxW)) return s;
  let out=s;
  while(out.length>1 && ctx.measureText(out+"…").width>S(maxW)) out=out.slice(0,-1);
  return out+"…";
}
function meas(s,size,weight,font){ctx.font=`${weight} ${S(size)}px ${font||SANS}`;
  return ctx.measureText(s).width/SC;}

function bez(p,t){const u=1-t,a=u*u*u,b=3*u*u*t,c=3*u*t*t,d=t*t*t;
  return[a*p[0]+b*p[2]+c*p[4]+d*p[6], a*p[1]+b*p[3]+c*p[5]+d*p[7]];}
function ctrlPts(e){
  const dx=e.x1-e.x0, dy=e.y1-e.y0, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L, o=L*e.bend;
  return [e.x0,e.y0, e.x0+dx*0.32+nx*o, e.y0+dy*0.32+ny*o,
          e.x0+dx*0.68+nx*o, e.y0+dy*0.68+ny*o, e.x1,e.y1];
}

function drawEdges(t){
  for(const e of D.edges){
    const p=ctrlPts(e);
    ctx.strokeStyle=e.reversed?"#ddd6fe":"#cfcabf";
    ctx.lineWidth=Math.max(1,S(1.3));
    if(e.reversed){ctx.setLineDash([S(6),S(5)]);}
    ctx.beginPath(); ctx.moveTo(TX(p[0]),TY(p[1]));
    ctx.bezierCurveTo(TX(p[2]),TY(p[3]),TX(p[4]),TY(p[5]),TX(p[6]),TY(p[7]));
    ctx.stroke(); ctx.setLineDash([]);

    const a=bez(p,0.985), tip=bez(p,1), ang=Math.atan2(tip[1]-a[1],tip[0]-a[0]);
    ctx.save(); ctx.translate(TX(tip[0]),TY(tip[1])); ctx.rotate(ang);
    ctx.strokeStyle="#b6b0a4"; ctx.lineWidth=Math.max(1,S(1.4));
    ctx.beginPath(); ctx.moveTo(-S(9),-S(5)); ctx.lineTo(0,0); ctx.lineTo(-S(9),S(5)); ctx.stroke();
    ctx.restore();

    
    for(let i=0;i<e.dots;i++){
      const u=(t*0.19+i/e.dots)%1, q=bez(p,u);
      const fade=Math.min(1,Math.sin(Math.PI*Math.min(u,1-u)*2.6)+0.35);
      ctx.fillStyle=`rgba(${DOTC},${0.85*fade})`;
      ctx.beginPath(); ctx.arc(TX(q[0]),TY(q[1]),S(4),0,7); ctx.fill();
      ctx.fillStyle=`rgba(${DOTC},${0.13*fade})`;
      ctx.beginPath(); ctx.arc(TX(q[0]),TY(q[1]),S(9),0,7); ctx.fill();
    }
    if(e.label) txt(e.label,e.labelX,e.labelY,
      {size:10.5,color:MUTED,align:"center",weight:600,spacing:1.2});
  }
}

function drawCard(n){
  const x=TX(n.x), y=TY(n.y), w=S(n.w), h=S(n.h);
  ctx.save(); ctx.shadowColor="rgba(30,28,24,.10)";
  ctx.shadowBlur=S(18); ctx.shadowOffsetY=S(5);
  ctx.fillStyle="#fff"; rr(x,y,w,h,S(12)); ctx.fill(); ctx.restore();
  ctx.strokeStyle=HAIR; ctx.lineWidth=Math.max(1,S(1)); rr(x,y,w,h,S(12)); ctx.stroke();
  if(n.num) txt(n.num,n.x+20,n.y+40,{size:21,weight:300,color:"#b8b3a8",font:MONO});
  txt(clip(n.title,17,700,n.w-70),n.x+22,n.y+n.h*0.60,{size:17,weight:700});
  if(n.detail) txt(clip(n.detail,12.5,400,n.w-40),n.x+22,n.y+n.h-20,{size:12.5,color:MUTED});
}

function drawHub(n,t){
  const cx=TX(n.x+n.w/2), cy=TY(n.y+n.h/2), R=S(n.w/2)*(1+Math.sin(t*1.4)*0.012);
  ctx.save(); ctx.shadowColor="rgba(109,40,217,.20)"; ctx.shadowBlur=S(34);
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill(); ctx.restore();
  ctx.strokeStyle="#ddd6fe"; ctx.lineWidth=S(4);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke();
  const g=[[-34,-22],[6,-40],[38,-14],[-6,6],[24,18],[-32,20]];
  ctx.strokeStyle="#c4b5fd"; ctx.lineWidth=S(1.4);
  for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){ if((i*7+j*3)%4) continue;
    ctx.beginPath(); ctx.moveTo(cx+S(g[i][0]),cy+S(g[i][1]-46));
    ctx.lineTo(cx+S(g[j][0]),cy+S(g[j][1]-46)); ctx.stroke(); }
  g.forEach((p,i)=>{ const a=0.55+0.45*Math.sin(t*2+i);
    ctx.fillStyle=`rgba(${DOTC},${a})`;
    ctx.beginPath(); ctx.arc(cx+S(p[0]),cy+S(p[1]-46),S(4.2),0,7); ctx.fill(); });
  txt(n.title,n.x+n.w/2,n.y+n.h/2+22,{size:20,weight:700,align:"center"});
  if(n.detail) txt(n.detail,n.x+n.w/2,n.y+n.h/2+44,{size:12,color:MUTED,align:"center"});
}

function drawLoop(n,t){
  const cx=TX(n.x+n.w/2), cy=TY(n.y+n.h/2), R=S(n.w/2);
  ctx.save(); ctx.fillStyle="#f5f3ff";
  ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
  ctx.setLineDash([S(5),S(7)]); ctx.lineDashOffset=-t*S(26);
  ctx.strokeStyle="#c4b5fd"; ctx.lineWidth=S(1.6);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke(); ctx.restore();
  if(n.num){ ctx.fillStyle=ACC;
    ctx.beginPath(); ctx.arc(TX(n.x+n.w/2),TY(n.y+n.h/2-30),S(17),0,7); ctx.fill();
    txt(n.num,n.x+n.w/2,n.y+n.h/2-25,{size:12,weight:700,color:"#fff",align:"center",font:MONO}); }
  txt(n.title,n.x+n.w/2,n.y+n.h/2+8,{size:17,weight:700,align:"center"});
  if(n.detail) txt(n.detail,n.x+n.w/2,n.y+n.h/2+30,{size:12,color:"#6d28d9",align:"center"});
  (n.pills||[]).forEach((s,i)=>{
    const a=-Math.PI/2+i*(Math.PI*2/n.pills.length)+t*0.22;
    const px=n.x+n.w/2+Math.cos(a)*n.w/2, py=n.y+n.h/2+Math.sin(a)*n.h/2;
    const w=meas(s,11.5,600)+24, h=24, q=TX(px-w/2), r=TY(py-h/2);
    ctx.fillStyle="#fff"; rr(q,r,S(w),S(h),S(12)); ctx.fill();
    ctx.strokeStyle="#e2ddd2"; ctx.lineWidth=Math.max(1,S(1));
    rr(q,r,S(w),S(h),S(12)); ctx.stroke();
    txt(s,px,py+4,{size:11.5,weight:600,color:"#5e594f",align:"center"});
  });
}

function drawChrome(t){
  
  txt(D.title,VW-70,132,{size:78,weight:800,align:"right"});
  (D.subtitle||[]).forEach((s,i)=>
    txt(s,VW-70,176+i*29,{size:16.5,weight:i?600:400,color:i?INK:"#57534b",align:"right"}));
  if(D.stat) txt(D.stat,VW-70,176+(D.subtitle||[]).length*29+6,
    {size:12.5,color:ACC,align:"right",weight:700,spacing:.6});

  
  if((D.status||[]).length){
    const w=700,h=48,x=70,y=74;
    ctx.save(); ctx.shadowColor="rgba(0,0,0,.22)"; ctx.shadowBlur=S(16); ctx.shadowOffsetY=S(4);
    ctx.fillStyle="#151412"; rr(TX(x),TY(y),S(w),S(h),S(10)); ctx.fill(); ctx.restore();
    const cols=["#e6e2d9","#a78bfa","#e6e2d9","#a78bfa","#c4b5fd"];
    let cx=x+22;
    D.status.forEach((s,i)=>{
      if(i){ txt("|",cx,y+31,{size:14,color:"#5a564e",font:MONO}); cx+=meas("|",14,400,MONO)+10; }
      txt(s,cx,y+31,{size:14,color:cols[i%cols.length],font:MONO,weight:600});
      cx+=meas(s,14,600,MONO)+10;
    });
    if(Math.floor(t*1.8)%2){ ctx.fillStyle="#a78bfa";
      ctx.fillRect(TX(cx+2),TY(y+16),S(8),S(17)); }
  }

  
  ctx.strokeStyle="#e6e2d9"; ctx.lineWidth=Math.max(1,S(1));
  ctx.beginPath(); ctx.moveTo(TX(0),TY(VH-120)); ctx.lineTo(TX(VW),TY(VH-120)); ctx.stroke();
  let x=70; const y=VH-72;
  for(const s of (D.chips||[])){
    const w=meas(s,12.5,500)+30;
    ctx.fillStyle="#fbfaf7"; rr(TX(x),TY(y),S(w),S(32),S(16)); ctx.fill();
    ctx.strokeStyle="#e2ddd2"; ctx.lineWidth=Math.max(1,S(1));
    rr(TX(x),TY(y),S(w),S(32),S(16)); ctx.stroke();
    txt(s,x+w/2,y+21,{size:12.5,color:"#5e594f",align:"center"});
    x+=w+12;
  }
  if(D.footnote) txt(D.footnote,VW-70,y+23,{size:12.5,color:"#57534b",align:"right"});
}

let last=performance.now(),fr=0,acc=0;
function frame(now){
  const dt=(now-last)/1000; last=now; const t=now/1000;
  acc+=dt; fr++;
  if(acc>0.5){document.getElementById("fps").textContent=Math.round(fr/acc)+" fps";fr=0;acc=0;}
  ctx.fillStyle="#f4f3ef"; ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.fillStyle="#fbfaf8"; ctx.fillRect(TX(0),TY(0),S(VW),S(VH));
  drawChrome(t);
  drawEdges(t);
  for(const n of D.nodes){
    if(n.kind==="hub") drawHub(n,t);
    else if(n.kind==="loop") drawLoop(n,t);
    else drawCard(n);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
