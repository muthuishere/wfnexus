name: author-workflow
description: >-
  Describe what you want done and get a workflow back that has already been
  checked against this machine. The agent reads the catalogues, drafts, dry runs
  its own draft, fixes what the dry run found, and only then proposes it.
  Authoring a workflow is itself a workflow.

on:
  workflow_dispatch:

input_schema:
  type: object
  required: [goal]
  properties:
    goal:
      type: string
      format: textarea
      title: "What should this workflow do?"
      description: "Plain English. Say what goes in, what should come out, and anything it must never do."
    name:
      type: string
      title: "Name for the new workflow"
      description: "lowercase-with-dashes; left empty the agent picks one"
    cheap:
      type: boolean
      title: "Prefer cheap, fast steps"
      default: true

steps:
  - id: author
    name: Draft and check a workflow
    description: Produce a workflow definition that is valid and would actually run here.

    soul: >-
      You write workflows for this platform and you do not hand over anything
      you have not checked. When the dry run disagrees with you, the dry run is
      right.

    # The DEFAULT model, deliberately. Authoring is the one workflow every
    # install runs before it has configured anything, so pinning it to a
    # provider that happens to be on this machine is how a fresh install finds
    # the feature broken. Name a provider here only if you want a specific one.

    # The method lives in the skill, not in this prompt. It is a skill so it can
    # be read, edited and reused by any step — including a step somebody writes
    # to EDIT a workflow rather than create one — instead of being a paragraph
    # that only this file has.
    skills: [workflow-author]
    tools: [wf_catalog, wf_validate, wf_dryrun]

    budget: { max_turns: 30, max_wall_sec: 1200 }

    prompt: |
      Write a workflow for this platform.

      WHAT IT SHOULD DO
      {{ .Input.goal }}

      {{ if .Input.name }}Call it `{{ .Input.name }}`.{{ end }}
      {{ if .Input.cheap }}Prefer cheap steps: a `run:` step for anything a
      shell command can decide, a `judge` step for a verdict, a full agent only
      where judgement over a repository is genuinely needed.{{ end }}

      Follow the workflow-author skill. Submit only a definition whose final
      dry run was clean.

    output_schema:
      type: object
      additionalProperties: false
      required: [definition, explanation, dry_run_clean]
      properties:
        definition:
          type: object
          description: "the whole workflow definition, ready to save"
        explanation:
          type: string
          description: "what it does, step by step, and what it deliberately does not do"
        dry_run_clean:
          type: boolean
          description: "did wf_dryrun report no problems on the final draft"
        cost_note:
          type: string
          description: "the ceiling the dry run reported"
        open_questions:
          type: array
          items: { type: string }
          description: "anything you had to assume"

    gates:
      # Advisory only, and deliberately labelled as such: this is the AGENT's
      # account of its own work, and a live run reported `true` for a definition
      # the loader then refused. The real check is `wfx apply --from-run`, which
      # dry runs the submitted definition before installing it.
      - field: dry_run_clean
        equals: false
        action: needs_input
        message: >-
          The agent says its draft still has problems. Read the explanation,
          then either say what to change, or approve and let `wfx apply
          --from-run` make the final decision.
