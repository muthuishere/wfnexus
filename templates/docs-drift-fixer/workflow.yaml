# docs-drift-fixer — keep docs true to the code, one verified statement at a time.
#
# EVIDENCE (docs/scenarios/top-6-by-category.md, development #2)
#   - GitHub's agentic workflow factory: "Daily Documentation Updater… 57 merged PRs
#     out of 59 proposed (96% merge rate)" — the best merge rate of its 298 workflows.
#     https://github.github.com/gh-aw/blog/2026-01-12-welcome-to-pelis-agent-factory/
#   - Mintlify's docs agent drafts doc updates from code changes.
#     https://www.mintlify.com/docs/agent
#   - dotnet/runtime: Documentation PRs merged at 68.1%.
#     https://devblogs.microsoft.com/dotnet/ten-months-with-cca-in-dotnet-runtime/
#
# WHAT THIS DOES BETTER THAN THOSE
#   1. Drift is FOUND by machine checks, not by an agent reading every doc: paths the
#      docs name that do not exist, symbols/flags no code has, and — the strongest
#      signal — names that a commit since the last run renamed or deleted.
#   2. The agent's first job is to REJECT flags: text about another product, generic
#      advice for other repos, and history are left alone. ADRs, changelogs,
#      proposals, spikes and research notes are excluded outright — rewriting a
#      dated decision is not a fix.
#   3. Every edit must cite the code line that makes it true; the classifier sees
#      that line READ FROM THE FILE by verify.py, never the agent's paraphrase, and
#      two calibrated questions must both be yes: was the old text contradicted
#      (stale) AND is the new text supported. A doc with any unverified edit is
#      restored whole and listed for a person — never half-committed.
#   4. Only documentation may change; one commit per doc; the PR lists what was
#      flagged and deliberately left alone, so a reviewer sees the misses too.
#   5. It remembers the last commit it checked (workflow state) so each daily run
#      looks at what changed since, and a dry run never advances that marker.
#
# Needs: git, python3, gh (publish only), TYPESAFE_API_KEY for `wfx judge`.
name: docs-drift-fixer
template:
  title: Docs drift fixer — docs true to the code
  category: development
  summary: >-
    Daily: finds doc statements the code or recent commits contradict, rewrites only
    those, proves every edit against the cited code line with a calibrated check,
    and opens one docs-only PR behind approval.
  fill:
    - "docs / exclude globs if your docs live elsewhere, or you keep history docs outside docs/adr"
    - "the base branch for the PR, if not the repository's default"
    - "TYPESAFE_API_KEY in the env store for the calibrated edit check"

description: >-
  Finds documentation that no longer matches the code — paths, symbols and flags
  the docs name that the code does not have, and names recent commits renamed or
  deleted — has an agent confirm each is really stale and make the smallest edit
  citing the code line that makes it true, re-checks every edit against that line
  with two calibrated questions, commits only what holds (one commit per doc), and
  opens a docs-only PR after a person approves.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
      input: { dry_run: false }

input_schema:
  type: object
  properties:
    repo_path:     { type: string,  title: "Local repo path (the run works in its own worktree)" }
    repo_url:      { type: string,  title: "…or a repo URL to clone" }
    base_branch:   { type: string,  title: "Base to branch from (default: the checkout's HEAD)" }
    since:         { type: string,  title: "Check changes since this commit (default: the last run's, else lookback_days)" }
    lookback_days: { type: integer, title: "First run: look back this many days", default: 14 }
    docs:          { type: string,  title: "Doc globs (comma-separated)", default: "README.md,**/README.md,docs/**/*.md,**/SKILL.md" }
    exclude:       { type: string,  title: "Never edit (history)", default: "docs/adr/**,**/CHANGELOG*,openspec/**,docs/spikes/**,docs/research/**,.claude/**,.codex/**,.opencode/**,**/node_modules/**" }
    max_findings:  { type: integer, title: "At most this many flags per run", default: 25 }
    dry_run:       { type: boolean, title: "Dry run — commit on the run's branch, write the PR body, push nothing", default: true }
    isolate:       { type: boolean, title: "Work in a throwaway git worktree", default: true }

steps:
  - id: collect
    name: Find drift (machine checks)
    description: Paths, symbols and flags the docs name that the code lacks; names recent commits renamed or deleted.
    timeout_sec: 900
    run: |
      printf '*\n' > .wfx-docs-drift/.gitignore
      SINCE='{{ if .Input.since }}{{ .Input.since }}{{ else }}{{ .Workflow.last_sha }}{{ end }}' \
      LOOKBACK_DAYS='{{ .Input.lookback_days }}' DOCS='{{ .Input.docs }}' EXCLUDE='{{ .Input.exclude }}' \
      MAX_FINDINGS='{{ .Input.max_findings }}' BRANCH="wfx/docs-drift-$(printf %.8s '{{ .RunID }}')" \
        python3 .wfx-docs-drift/collect.py
      c=$?; case $c in 0|78) exit $c;; *) exit 70;; esac
    gates:
      - { field: exitCode, equals: 70, action: fail, message: "Collect failed — {{ .Output.stderr }}" }
      - { field: exitCode, equals: 78, action: skip_to, skip_to: remember }

  - id: sync
    name: Confirm and fix each flag (doc-syncer)
    description: Reject flags that are not drift; for real drift, the smallest edit citing the code line. Working tree only.
    provider: claude-cli
    skills: [doc-syncer, repo-navigator]
    tools: [read, edit, grep, glob, bash]
    max_turns: 80
    timeout_sec: 2400
    soul: >-
      You are a technical writer who trusts only the code. Most flags you are handed
      are not drift, and saying so is half your job. When text is wrong you change
      only the wrong words, and you can point at the line that makes the new words true.
    guardrails:
      - { deny: bash, args_contain: ["git commit", "git push", "git checkout", "git reset", "git stash", "gh pr"], reason: "edits stay in the working tree; a later step verifies and commits" }
    prompt: |
      Machine checks flagged the doc statements in `.wfx-docs-drift/candidates.jsonl`
      (fields: id, kind, doc, line, token, detail, commit). Kinds: moved-path,
      removed-symbol (a recent commit deleted it), missing-path, missing-symbol,
      missing-flag. The commits checked are `$(cat .wfx-docs-drift/since.txt)..HEAD`.

      Follow the doc-syncer skill for EVERY candidate:
      - not drift (another product, generic advice for other repos, history, a path
        relative to a module that exists) → `not_stale` with the reason;
      - real drift → edit the doc in place, changing only the wrong words, and
        report the edit with the EXACT old and new text (as they appear in the
        file, one statement each), the code `path:line` that makes the new text
        true, and the commit that caused the drift if known;
      - cannot tell what is true now → `unsure`, no edit.
      Edit only documentation files. Do not commit.
    output_schema:
      type: object
      additionalProperties: false
      required: [edits, not_stale, unsure, summary]
      properties:
        summary: { type: string }
        edits:
          type: array
          items:
            type: object
            required: [candidate_id, doc, old_text, new_text, code_refs, summary]
            properties:
              candidate_id: { type: string }
              doc:          { type: string }
              old_text:     { type: string, description: "the statement before, verbatim" }
              new_text:     { type: string, description: "the statement after, verbatim" }
              code_refs:    { type: array, items: { type: string }, description: "path:line that makes new_text true" }
              commit:       { type: string, description: "the commit that caused the drift, if known" }
              summary:      { type: string, description: "a few words, e.g. 'authoring tools are wf_catalog/wf_validate'" }
        not_stale:
          type: array
          items:
            type: object
            required: [candidate_id, why]
            properties: { candidate_id: { type: string }, why: { type: string } }
        unsure:
          type: array
          items:
            type: object
            required: [candidate_id, why]
            properties: { candidate_id: { type: string }, why: { type: string } }

  - id: verify
    name: Verify every edit against the code (JEV) and commit
    description: Docs-only diff; evidence read from the cited line; stale AND supported both yes, else the doc is restored.
    timeout_sec: 900
    run: |
      cat > .wfx-docs-drift/sync.json <<'WFX_SYNC_EOF'
      {{ json .Steps.sync }}
      WFX_SYNC_EOF
      python3 .wfx-docs-drift/verify.py
      c=$?; case $c in 0|78) exit $c;; *) exit 70;; esac
    gates:
      - { field: exitCode, equals: 70, action: fail, message: "Verification failed — {{ .Output.stdout }}{{ .Output.stderr }}" }
      - { field: exitCode, equals: 78, action: skip_to, skip_to: remember }

  - id: dry_run_stop
    name: Stop here on a dry run
    description: A dry run ends with the branch and the PR body — nothing is pushed.
    run: '[ "{{ .Input.dry_run }}" = "false" ] && { echo "live run: continuing to the publish gate"; exit 0; } || { echo "dry run: stopping before any push"; exit 78; }'
    gates:
      - { field: exitCode, equals: 78, action: skip_to, skip_to: remember }

  - id: publish
    name: Push and open the docs PR (pr-publisher)
    description: Push this run's branch and open the PR with the verified body.
    requires_approval: true
    provider: claude-cli
    skills: [pr-publisher]
    tools: [read, bash]
    max_turns: 15
    guardrails:
      - { deny: bash, args_contain: ["push --force", "push -f", "reset --hard", "git commit"], reason: "publish exactly what was verified" }
    prompt: |
      Publish this run's branch (`git rev-parse --abbrev-ref HEAD`) as a pull request,
      following pr-publisher. Base: {{ if .Input.base_branch }}{{ .Input.base_branch }}{{ else }}the repository's default branch{{ end }}.
      Title: "[docs-drift] docs that no longer matched the code". Body:
      `--body-file .wfx-docs-drift/pr-body.md`. Add the label `documentation` if it exists.
    output_schema:
      type: object
      additionalProperties: false
      required: [published, pr_url]
      properties:
        published: { type: boolean }
        pr_url:    { type: string }

  # Remember how far this run looked, so tomorrow starts there. A dry run keeps the
  # old marker: rehearsing must not make the next real run skip a day of commits.
  - id: remember
    name: Remember the last commit checked
    description: Workflow state `last_sha` — advanced only by a real run.
    run: |
      if [ "{{ .Input.dry_run }}" = "false" ]; then git rev-parse {{ .BaseRef }}; else printf '%s' '{{ .Workflow.last_sha }}'; fi | tr -d '\n'
    state:
      workflow:
        last_sha: "{{ .Output.stdout }}"

  - id: report
    name: Report
    description: What was flagged, fixed, held and left alone; where the branch and PR body are.
    run: |
      D=.wfx-docs-drift
      echo "dry_run={{ .Input.dry_run }} · worktree $(pwd) · branch $(git rev-parse --abbrev-ref HEAD) · since $(cat $D/since.txt 2>/dev/null | cut -c1-10)"
      echo "--- commits"; git log --oneline {{ .BaseRef }}..HEAD 2>/dev/null || true
      [ -f $D/pr-body.md ] && { echo "--- PR body: $(pwd)/$D/pr-body.md"; head -c 2200 $D/pr-body.md; }
      exit 0
