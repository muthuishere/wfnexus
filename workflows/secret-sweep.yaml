name: secret-sweep
description: >-
  Look for credential-shaped strings in what you are about to commit, and fail
  the run if any are there. No model is called, so it costs nothing and can sit
  in front of every push. It reads the STAGED diff, because that is what is
  actually about to leave the machine — not the working tree, not the whole
  history.

on:
  workflow_dispatch:
  repository_dispatch:

input_schema:
  type: object
  properties:
    dir:
      type: string
      title: "Repository to sweep"
      default: "."

steps:
  # Split in two on purpose: a sweep that finds nothing and a sweep that cannot
  # run must not look the same. This step fails loudly if the path is not a
  # repository, instead of reporting a clean tree for a directory it never read.
  - id: staged
    name: What is staged
    run: |
      cd "{{ .Input.dir }}" || exit 64
      git rev-parse --git-dir >/dev/null 2>&1 || exit 65
      git diff --cached --name-only

  - id: sweep
    name: Sweep the staged diff
    # Assignments only: `API_KEY=sk-…`, `"token": "…"`, a PEM header, an AWS id.
    # Looking for the SHAPE of a secret being written down, not for the word
    # "key", which every codebase says a thousand times.
    run: |
      cd "{{ .Input.dir }}" || exit 64
      diff=$(git diff --cached -U0)
      hits=$(printf '%s\n' "$diff" | grep -nE '^\+' | grep -viE '^\+*[0-9]*:?\+?\s*(#|//|\*)' | grep -nEi \
        -e '(api[_-]?key|secret|passwd|password|token|private[_-]?key|access[_-]?key)["'"'"']?\s*[:=]\s*["'"'"']?[A-Za-z0-9/_+=-]{16,}' \
        -e 'BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY' \
        -e 'AKIA[0-9A-Z]{16}' \
        -e 'xox[baprs]-[0-9A-Za-z-]{10,}' \
        -e 'gh[pousr]_[0-9A-Za-z]{36}' || true)
      if [ -n "$hits" ]; then
        printf '%s\n' "$hits"
        exit 1
      fi
      echo "clean"
    gates:
      # A `run:` step reports its exit code as data; the workflow is where that
      # becomes a verdict. This is the line that turns a hit into a stopped run.
      - field: ok
        equals: false
        action: fail
        message: >-
          a credential-shaped string is in the staged diff — check the output of
          this step, and put the value behind `sec` instead of into a file
