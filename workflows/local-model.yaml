# Managed by the wfnexus workflow builder.
# Hand edits are fine; the builder round-trips through the same loader.
name: local-model
description: 'One step whose MODEL is a program on this machine — a coding-agent CLI or an ACP process — instead of an HTTP endpoint. Everything else about the step is unchanged: the same agent loop, the same tools, the same typed hand-off. This is the workflow that proves a `cli` / `acp` provider actually executes.'
input_schema:
    properties:
        question:
            default: What does this repository do, in one sentence?
            title: What to ask it about the repository
            type: string
    type: object
steps:
    - id: ask-local
      name: Ask the local agent
      description: Run one step on a local CLI as the model.
      prompt: |
        Repository: {{ .WorkDir }}

        {{ .Input.question }}

        Read enough of the repository to answer honestly, then call
        submit_output. Name the files you actually looked at.
      skills: []
      tools:
        - read
        - grep
        - glob
        - bash
      output_schema:
        additionalProperties: false
        properties:
            answer:
                type: string
            files_read:
                items:
                    type: string
                type: array
        required:
            - answer
            - files_read
        type: object
      max_turns: 30
      max_attempts: 3
      soul: You answer from the repository in front of you, briefly, and you do not speculate about code you have not read.
      budget:
        max_turns: 12
        max_tool_calls: 30
        max_wall_sec: 900
      guardrails:
        - deny: '*'
          args_contain:
            - git push
            - gh pr
            - git commit
          reason: this step only reads the repository
      provider: claude-headless
max_parallel: 4
