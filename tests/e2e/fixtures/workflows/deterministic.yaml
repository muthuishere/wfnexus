name: deterministic
description: >-
  Two shell steps and nothing else. It exists so the UI can be tested end to
  end — start a run, watch it finish, read its output — without a model, a key
  or a network call. It also carries no `skills:` and no `tools:`, which is the
  case that once white-screened the run page.
on:
  workflow_dispatch:
input_schema:
  type: object
  properties:
    label: { type: string, title: "Label", default: "e2e" }
steps:
  - id: greet
    run: echo "hello {{ .Input.label }}"
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }
  - id: count
    # The run's story (engine/story.go): a summary and a verdict, written to
    # the files the engine names. stdout is unchanged.
    run: |
      printf 'a\nb\nc\n' | wc -l
      echo '## Counted 3 lines' >> "$WFX_STEP_SUMMARY"
      echo 'ok: counted 3 lines' > "$WFX_OUTCOME"
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }
