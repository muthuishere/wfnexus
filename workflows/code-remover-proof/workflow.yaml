# Managed by the wfnexus workflow builder.
# Hand edits are fine; the builder round-trips through the same loader.
name: code-remover-proof
description: Evidence-based dead-code removal. Machine finders (deadcode, staticcheck U1000, go mod tidy -diff, knip) inventory candidates; machine checks search every tracked file, call shapes, indirect use and history; an agent tries to prove each one is used; a calibrated classifier scores what is left and a decision table decides remove / keep / bug / needs-a-human. After a person approves the plan, each removal is its own commit with the suite green after it, re-proven independently, reviewed by a different model, and described in a PR whose every claim is checked against the evidence. Nothing is pushed until a person approves.
input_schema:
    properties:
        base_branch:
            title: 'Base to branch from (default: the checkout''s HEAD)'
            type: string
        dry_run:
            default: true
            title: Dry run — commit on the run's branch, write the PR body, push nothing
            type: boolean
        isolate:
            default: true
            title: Work in a throwaway git worktree
            type: boolean
        max_removals:
            default: 10
            title: At most this many removals per PR
            type: integer
        pr_prefix:
            default: '[dead-code]'
            title: PR title prefix (also the duplicate check)
            type: string
        repo_path:
            title: Local repo path (the run works in its own worktree)
            type: string
        repo_url:
            title: …or a repo URL to clone
            type: string
        scope:
            default: .
            title: Directory to clean (a module or package)
            type: string
    type: object
"on":
    schedule:
        - cron: 0 6 * * 1
          input:
            dry_run: false
    workflow_dispatch: null
steps:
    - id: baseline
      name: Baseline build and test counts
      description: Skip if a cleanup PR is already open; branch; build, vet and COUNT tests before touching anything.
      prompt: ""
      skills: []
      tools: []
      output_schema:
        additionalProperties: false
        properties:
            exitCode:
                type: integer
            ok:
                description: exit code was zero
                type: boolean
            stderr:
                type: string
            stdout:
                type: string
        required:
            - ok
            - exitCode
        type: object
      max_turns: 30
      max_attempts: 3
      timeout_sec: 3600
      gates:
        - field: exitCode
          equals: 70
          action: fail
          message: Baseline failed — {{ .Output.stdout }}{{ .Output.stderr }}
        - field: exitCode
          equals: 78
          action: skip_to
          skip_to: report
      run: |
        printf '*\n' > .wfx-code-remover/.gitignore
        SCOPE='{{ .Input.scope }}' PR_PREFIX='{{ .Input.pr_prefix }}' \
        BRANCH="wfx/code-remover-$(printf %.8s '{{ .RunID }}')" \
          python3 .wfx-code-remover/baseline.py
        c=$?; case $c in 0|78) exit $c;; *) exit 70;; esac
    - id: inventory
      name: Inventory candidates (dead-code-finder)
      description: deadcode -test, staticcheck U1000, go mod tidy -diff, knip — every candidate with the tool line that found it.
      prompt: ""
      skills: []
      tools: []
      output_schema:
        additionalProperties: false
        properties:
            exitCode:
                type: integer
            ok:
                description: exit code was zero
                type: boolean
            stderr:
                type: string
            stdout:
                type: string
        required:
            - ok
            - exitCode
        type: object
      max_turns: 30
      max_attempts: 3
      timeout_sec: 1800
      gates:
        - field: exitCode
          equals: 70
          action: fail
          message: Inventory failed — {{ .Output.stderr }}
        - field: exitCode
          equals: 78
          action: skip_to
          skip_to: report
      run: |
        SCOPE='{{ .Input.scope }}' python3 .wfx-code-remover/inventory.py
        c=$?; case $c in 0|78) exit $c;; *) exit 70;; esac
    - id: checks
      name: Machine usage checks
      description: Per candidate, >=4 independent checks — literal repo-wide search, call shapes, indirect use, history, code graph.
      prompt: ""
      skills: []
      tools: []
      output_schema:
        additionalProperties: false
        properties:
            exitCode:
                type: integer
            ok:
                description: exit code was zero
                type: boolean
            stderr:
                type: string
            stdout:
                type: string
        required:
            - ok
            - exitCode
        type: object
      max_turns: 30
      max_attempts: 3
      timeout_sec: 900
      gates:
        - field: exitCode
          equals: 70
          action: fail
          message: Checks failed — {{ .Output.stderr }}
      run: python3 .wfx-code-remover/checks.py || exit 70
    - id: prove
      name: Prove each candidate IS used (usage-prover)
      description: Read every hit adversarially; find indirect use, dependent text and lost callers. Reads only.
      prompt: |
        The finders flagged the candidates in `.wfx-code-remover/candidates.jsonl`.
        Machine checks for each are in `.wfx-code-remover/checks.jsonl`: `code_hits`,
        `text_hits`, `call_hits` (every file:line the searches found besides the
        definition and its own doc comment), `indirect` signals and `history`.
        Scope: {{ .Input.scope }}. Base commit: {{ .BaseRef }}.

        Follow the usage-prover skill. For EVERY candidate:
        1. Read its definition, then read every code hit and every call hit. A hit may
           be a DIFFERENT symbol with the same name (another package, a local
           variable, a CLI word in a string) — say so. A caller that is itself one of
           the candidates AND itself unreachable does not keep this one alive; dismiss
           it as "called only from <candidate id>, itself unreachable".
        2. Indirect use: interface satisfaction (String/Error/MarshalJSON…, or an
           interface in this repo declaring the method), reflection, a registry keyed
           by string, build tags, another module's tests.
        3. Text hits: split into `dependent_text` (a template, config key, route
           string, CLI flag, or an instruction someone follows breaks if it goes) and
           `descriptive_text` (a doc example, comment or changelog that only quotes
           it — these get updated in the removal commit).
        4. Lost caller: a live sibling doing the same job, a documented feature
           nothing triggers, or `git log -S` showing the last call vanishing in a
           commit about something else. If so, `lost_caller: true` with the why.

        Every entry of `call_hits` MUST appear in either `real_references` or
        `dismissed_hits` (as "path:line"), or the candidate goes to a human.
        Do not modify any file. Submit one entry per candidate, using its `id`.
      skills:
        - usage-prover
        - repo-navigator
      tools:
        - read
        - grep
        - glob
        - bash
      output_schema:
        additionalProperties: false
        properties:
            candidates:
                items:
                    properties:
                        analysis:
                            description: 'plain sentences: what each check showed and why that settles it'
                            type: string
                        dependent_text:
                            description: path:line — text that breaks if it goes
                            items:
                                type: string
                            type: array
                        descriptive_text:
                            description: path:line — text that only quotes it
                            items:
                                type: string
                            type: array
                        dismissed_hits:
                            items:
                                properties:
                                    hit:
                                        description: path:line
                                        type: string
                                    why:
                                        type: string
                                required:
                                    - hit
                                    - why
                                type: object
                            type: array
                        id:
                            type: string
                        lost_caller:
                            type: boolean
                        lost_caller_why:
                            type: string
                        real_references:
                            description: path:line — what actually uses it, and how
                            items:
                                type: string
                            type: array
                    required:
                        - id
                        - real_references
                        - dependent_text
                        - descriptive_text
                        - dismissed_hits
                        - lost_caller
                        - analysis
                    type: object
                type: array
            summary:
                description: 'two sentences: how many look removable, kept, bugs'
                type: string
        required:
            - candidates
            - summary
        type: object
      max_turns: 80
      max_attempts: 3
      timeout_sec: 2400
      soul: You are the defence attorney for every piece of code a tool called dead. You win when you find what uses it. You do not edit, delete or commit anything, and a hit you have not read is a hit you have not explained.
      guardrails:
        - deny: bash
          args_contain:
            - git commit
            - git checkout
            - git reset
            - git stash
            - git push
            - sed -i
            - rm -
          reason: the prover only reads
      provider: claude-cli
    - id: plan
      name: Judge and plan (JEV + decision table)
      description: wfx judge per candidate, then remove / keep / bug / needs-a-human — applied literally, capped per PR.
      prompt: ""
      skills: []
      tools: []
      output_schema:
        additionalProperties: false
        properties:
            exitCode:
                type: integer
            ok:
                description: exit code was zero
                type: boolean
            stderr:
                type: string
            stdout:
                type: string
        required:
            - ok
            - exitCode
        type: object
      max_turns: 30
      max_attempts: 3
      timeout_sec: 900
      gates:
        - field: exitCode
          equals: 70
          action: fail
          message: Planning failed — {{ .Output.stdout }}{{ .Output.stderr }}
        - field: exitCode
          equals: 78
          action: skip_to
          skip_to: report
      run: |
        cat > .wfx-code-remover/prove.json <<'WFX_PROVE_EOF'
        {{ json .Steps.prove }}
        WFX_PROVE_EOF
        MAX_REMOVALS='{{ .Input.max_removals }}' python3 .wfx-code-remover/plan.py
        c=$?; case $c in 0|78) exit $c;; *) exit 70;; esac
    - id: remove
      name: Remove the approved candidates (safe-remover)
      description: One commit per removal with its evidence; orphans cleaned; build+vet+test after each; revert on red.
      prompt: |
        The approved plan is `.wfx-code-remover/plan.json` (human-readable:
        `.wfx-code-remover/plan.md`). Remove ONLY rows whose `verdict` is `remove`.
        You are already on this run's branch (`.wfx-code-remover/baseline.json` →
        `branch`), cut from base commit {{ .BaseRef }}.

        Follow the safe-remover skill, one removal at a time:
        1. Delete the definition. When one approved candidate calls another, remove
           the caller first so every commit builds.
        2. Delete what it orphans and ONLY that: a test exercising nothing but it, an
           import or helper used only by it. For each `descriptive_text` entry, fix
           the text in the same commit (drop the sentence, or re-point an example at
           something that exists) — never leave text naming a symbol that is gone.
        3. In the module (`module` field): `go build ./... && go vet ./... && go test ./...`
           (or the package's build+test for non-Go). Red → `git checkout -- .` and
           record it as reverted with the error; never edit other code to make it pass.
        4. Stage with `git add -u` (plus a new file only if you truly created one —
           never `git add -A`/`.`; `.wfx-code-remover/` must never be committed) and
           commit with the skill's message format:
           `remove <symbol>: unreachable, <one-line evidence>` + Found by / Checks /
           Classifier / Also removed lines (numbers from plan.json).
        Append one JSON line per candidate to `.wfx-code-remover/removals.jsonl`:
        {"symbol", "status": "removed"|"reverted", "sha", "lines_deleted",
         "orphan_tests": [test names deleted], "also_removed": [...], "error"}.
      skills:
        - safe-remover
      tools:
        - read
        - edit
        - write
        - grep
        - glob
        - bash
      output_schema:
        additionalProperties: false
        properties:
            removed:
                description: symbol — short sha
                items:
                    type: string
                type: array
            reverted:
                description: symbol — the error
                items:
                    type: string
                type: array
            summary:
                type: string
        required:
            - removed
            - reverted
            - summary
        type: object
      max_turns: 120
      max_attempts: 3
      timeout_sec: 3600
      requires_approval: true
      soul: You delete exactly what a person approved and nothing else. A removal that breaks the build was wrong, and you revert it rather than fix forward.
      guardrails:
        - deny: bash
          args_contain:
            - git push
            - gh pr
            - git add -A
            - git add --all
            - git add .
            - --no-verify
            - git reset --hard
            - git rebase
            - git commit --amend
          reason: one plain commit per approved removal, staged with git add -u, never pushed
      provider: claude-cli
    - id: verify
      name: Prove the branch (before vs after)
      description: Suite again with counts; every commit is a planned removal; no fix-forward; finders re-run for cascades.
      prompt: ""
      skills: []
      tools: []
      output_schema:
        additionalProperties: false
        properties:
            exitCode:
                type: integer
            ok:
                description: exit code was zero
                type: boolean
            stderr:
                type: string
            stdout:
                type: string
        required:
            - ok
            - exitCode
        type: object
      max_turns: 30
      max_attempts: 3
      timeout_sec: 3600
      gates:
        - field: exitCode
          equals: 70
          action: fail
          message: The branch did not prove out — {{ .Output.stdout }}
      run: python3 .wfx-code-remover/verify.py || exit 70
    - id: review
      name: Adversarial review on a different model (change-reviewer)
      description: codex-cli reviews the diff it did not write, against the plan and the proof.
      prompt: |
        Review the dead-code removal on this branch: `git diff {{ .BaseRef }}..HEAD`
        and `git log --stat {{ .BaseRef }}..HEAD`. The approved plan is
        `.wfx-code-remover/plan.json`; the independent proof is
        `.wfx-code-remover/verify.json` (suite before/after, commits).

        Follow change-reviewer. For a removal PR, hunt specifically for: anything
        deleted that the plan did not approve; a removed symbol still reachable
        through an interface, reflection, a string key or another build context;
        orphans left behind (imports, helpers, tests or docs that named it); a test
        deleted that exercised LIVE code; any line added that is not a doc fix.
        Run `go build ./... && go vet ./...` in the module yourself.
        `approved: false` only for a blocker, and say exactly which commit.
      skills:
        - change-reviewer
      tools:
        - read
        - grep
        - glob
        - bash
      output_schema:
        additionalProperties: false
        properties:
            approved:
                type: boolean
            findings:
                items:
                    properties:
                        commit:
                            type: string
                        severity:
                            enum:
                                - blocker
                                - major
                                - minor
                                - nit
                            type: string
                        what:
                            type: string
                    required:
                        - severity
                        - what
                    type: object
                type: array
            verdict:
                type: string
        required:
            - approved
            - verdict
            - findings
        type: object
      max_turns: 40
      max_attempts: 3
      timeout_sec: 1800
      gates:
        - field: approved
          equals: false
          action: needs_input
          message: 'The codex reviewer blocked the branch: {{ .Output.verdict }}'
      guardrails:
        - deny: bash
          args_contain:
            - git commit
            - git push
            - git checkout
            - git reset
          reason: the reviewer reads
      provider: codex-cli
    - id: write_pr
      name: Write the cleanup PR (cleanup-pr-writer)
      description: Removals table with evidence and commits, kept and why, bugs, needs-a-human, before/after, revert per commit.
      prompt: |
        Write the pull request for this branch, following cleanup-pr-writer.
        Facts, all in `.wfx-code-remover/`: plan.json (every candidate, its verdict,
        the classifier's numbers, why), evidence.jsonl (the checks per candidate),
        removals.jsonl, verify.json (suite before/after, commits with SHAs, lines,
        newly unreachable), and the reviewer's verdict: {{ .Steps.review.verdict }}

        1. Write `.wfx-code-remover/pr-body.md` in the skill's order. Use only numbers
           from those files. Quote the before and after pass counts and lines
           deleted exactly, and every removal commit's 7-char SHA. Add a
           "Next run" line listing `newly_unreachable` from verify.json, and say the
           claims were checked by a calibrated classifier.
        2. Write `.wfx-code-remover/claims.jsonl`, one line per removal row, kept row,
           bug row and the verification table:
           {"id": "<row>", "claim": "<the row's why/what text as written in the body>",
            "about": ["<candidate id from plan.json>" | "verification"]}
        3. Run `python3 .wfx-code-remover/claims.py`. For any claim not supported or
           number missing, rewrite the body to say only what the evidence shows (or
           move the row to "Needs a human") and run it again until it exits 0.
      skills:
        - cleanup-pr-writer
      tools:
        - read
        - write
        - edit
        - grep
        - glob
        - bash
      output_schema:
        additionalProperties: false
        properties:
            claims:
                description: claims checked
                type: integer
            summary:
                type: string
            title:
                description: starts with the PR prefix, e.g. [dead-code] remove 6 unreachable functions in apps/api
                type: string
        required:
            - title
            - summary
            - claims
        type: object
      max_turns: 40
      max_attempts: 3
      timeout_sec: 1800
      guardrails:
        - deny: bash
          args_contain:
            - git commit
            - git push
            - gh pr
          reason: the writer writes the body; publishing is a later, gated step
      provider: claude-cli
    - id: claims
      name: Re-check every claim (JEV) and the numbers
      description: Independent of the writer — evidence from the machine's files; body must quote real counts and every SHA.
      prompt: ""
      skills: []
      tools: []
      output_schema:
        additionalProperties: false
        properties:
            exitCode:
                type: integer
            ok:
                description: exit code was zero
                type: boolean
            stderr:
                type: string
            stdout:
                type: string
        required:
            - ok
            - exitCode
        type: object
      max_turns: 30
      max_attempts: 3
      timeout_sec: 600
      gates:
        - field: exitCode
          equals: 20
          action: needs_input
          message: PR claims not supported by the evidence — {{ .Output.stdout }}
        - field: exitCode
          equals: 70
          action: fail
          message: Claim check failed — {{ .Output.stderr }}
      run: |
        python3 .wfx-code-remover/claims.py
        c=$?; case $c in 0|20) exit $c;; *) exit 70;; esac
    - id: dry_run_stop
      name: Stop here on a dry run
      description: A dry run ends with the branch and the PR body — nothing is pushed.
      prompt: ""
      skills: []
      tools: []
      output_schema:
        additionalProperties: false
        properties:
            exitCode:
                type: integer
            ok:
                description: exit code was zero
                type: boolean
            stderr:
                type: string
            stdout:
                type: string
        required:
            - ok
            - exitCode
        type: object
      max_turns: 30
      max_attempts: 3
      gates:
        - field: exitCode
          equals: 78
          action: skip_to
          skip_to: report
      run: '[ "{{ .Input.dry_run }}" = "false" ] && { echo "live run: continuing to the publish gate"; exit 0; } || { echo "dry run: stopping before any push"; exit 78; }'
    - id: publish
      name: Push and open the PR (pr-publisher)
      description: Push this run's branch and open the PR with the checked body.
      prompt: |
        Publish this run's branch (see `.wfx-code-remover/baseline.json` → `branch`)
        as a pull request, following pr-publisher.
        Base: {{ if .Input.base_branch }}{{ .Input.base_branch }}{{ else }}the repository's default branch (`gh repo view --json defaultBranchRef`){{ end }}.
        Title: {{ .Steps.write_pr.title }}
        Body: `--body-file .wfx-code-remover/pr-body.md`. Read back the PR URL.
      skills:
        - pr-publisher
      tools:
        - read
        - bash
      output_schema:
        additionalProperties: false
        properties:
            pr_url:
                type: string
            published:
                type: boolean
        required:
            - published
            - pr_url
        type: object
      max_turns: 15
      max_attempts: 3
      requires_approval: true
      guardrails:
        - deny: bash
          args_contain:
            - push --force
            - push -f
            - reset --hard
            - git commit
          reason: publish exactly what was approved
      provider: claude-cli
    - id: report
      name: Report
      description: Branch, commits, plan and PR body location — the run's answer whatever path it took.
      prompt: ""
      skills: []
      tools: []
      output_schema:
        additionalProperties: false
        properties:
            exitCode:
                type: integer
            ok:
                description: exit code was zero
                type: boolean
            stderr:
                type: string
            stdout:
                type: string
        required:
            - ok
            - exitCode
        type: object
      max_turns: 30
      max_attempts: 3
      run: |
        D=.wfx-code-remover
        echo "dry_run={{ .Input.dry_run }} · worktree $(pwd) · branch $(git rev-parse --abbrev-ref HEAD)"
        echo "--- commits on the branch"; git log --oneline {{ .BaseRef }}..HEAD 2>/dev/null || true
        [ -f $D/plan.md ] && { echo "--- plan"; head -c 1500 $D/plan.md; }
        [ -f $D/verify.json ] && python3 -c "import json;v=json.load(open('$D/verify.json'));print('--- proof: before',v['before'],'after',v['after'],'lines -%d +%d'%(v['lines_deleted'],v['lines_added']),'next run:',v['newly_unreachable'])"
        [ -f $D/pr-body.md ] && { echo "--- PR body: $(pwd)/$D/pr-body.md"; head -c 900 $D/pr-body.md; }
        exit 0
max_parallel: 4
