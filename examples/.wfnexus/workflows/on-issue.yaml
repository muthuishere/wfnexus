name: on-issue
description: >-
  Started by another system. A forge's own Actions workflow POSTs a
  repository_dispatch when an issue is labelled, and this triages it and writes
  the verdict back as a comment.

# Actions' own inbound trigger. `types` narrows which event names this answers,
# exactly as it does there; an event_type not listed here is refused.
on:
  repository_dispatch:
    types: [issue_labelled, bug_reported]
  workflow_dispatch:

input_schema:
  type: object
  required: [repo_path, issue_title, issue_body]
  properties:
    repo_path:    { type: string, title: "Local repo path" }
    issue_title:  { type: string, title: "Issue title" }
    issue_body:   { type: string, title: "Issue body", format: textarea }
    issue_number: { type: integer, title: "Issue number" }

jobs:
  triage:
    name: Decide what this is
    steps:
      - id: classify
        name: Classify the report
        soul: >-
          You classify, you do not solve. You are precise about what the report
          says and silent about what it does not.
        tools: [read, grep, glob]
        budget: { max_turns: 20, max_tool_calls: 50, max_wall_sec: 600 }
        prompt: |
          Repository: {{ .WorkDir }}

          Title: {{ .Input.issue_title }}

          {{ .Input.issue_body }}

          Check the claim against the actual code before calling it plausible.
          Then call submit_output.
        output_schema:
          type: object
          additionalProperties: false
          required: [kind, actionable, summary]
          properties:
            kind:       { type: string, enum: [bug, question, feature_request, docs, duplicate, unclear] }
            actionable: { type: boolean }
            summary:    { type: string }
            component:  { type: string }
            missing:    { type: array, items: { type: string } }

  reply:
    name: Write the reply
    needs: [triage]
    steps:
      - id: comment
        name: Draft a comment
        description: Turn the classification into something a human would want to read.
        soul: >-
          You write the comment a good maintainer writes: short, specific, and
          honest about what is still unknown. You never pretend to certainty the
          classification did not have.
        tools: [read]
        budget: { max_turns: 8, max_wall_sec: 180 }
        prompt: |
          The report was classified as `{{ index .Steps "triage.classify" "kind" }}`,
          actionable={{ index .Steps "triage.classify" "actionable" }}.

          {{ index .Steps "triage.classify" "summary" }}

          Write the reply. If it is not actionable, ask only for what is
          genuinely missing. Then call submit_output.
        output_schema:
          type: object
          additionalProperties: false
          required: [body]
          properties:
            body:  { type: string }
            label: { type: string, description: "one label to apply, or empty" }
