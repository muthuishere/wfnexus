name: workflow-doctor
description: >-
  The platform looking after its own workflows. Every hour it collects what is
  broken across every project — failed runs, files that do not load, workflow
  folders with no workflow.yaml, workflow folders that are not in git — finds
  the cause of each, fixes the ones that are code, proves each fix (validate,
  and the Go suite when platform code changed), has a different model review
  it, opens a pull request, and merges. What code cannot fix — a missing
  secret, a real outage the workflow correctly reported — is reported with the
  exact command a person runs.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

input_schema:
  type: object
  properties:
    auto_merge: { type: boolean, title: "Merge a fix that passed verify and review without asking", default: false }
    max_fixes:  { type: integer, title: "At most this many fixes per run", default: 3 }
    dry_run:    { type: boolean, title: "Diagnose and report only: no branches, PRs or merges", default: false }

steps:
  # 1. Rules before models. Exit 0 = nothing broken, and only the report runs.
  - id: collect
    name: Collect what is broken
    description: Failed runs since the last look, load problems, incomplete and untracked workflow folders. Read-only.
    run: python3 ./collect.py
    timeout_sec: 120
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }

  # 2. Why, for each finding. Reads, never edits.
  - id: diagnose
    name: Find the cause of each finding
    needs: [collect]
    when:
      - path: collect.exitCode
        equals: 3
    provider: claude-cli
    skills: [prod-signal-triage, repo-navigator, workflow-author]
    tools: [read, grep, glob, bash]
    max_turns: 60
    guardrails:
      - deny: bash
        args_contain: ["git push", "git commit", "gh pr", "gh issue", "wfx approve", "wfx env set", "rm -", "kamal", "docker "]
        reason: "diagnosis reads; fixing, publishing and merging are later steps"
    system: >-
      You are the engineer who owns this workflow platform. You report only what
      the run's events, the workflow file and the code show, with file:line, and
      you say "unknown" rather than guess.
    prompt: |
      ./findings.json lists what is broken. For each finding decide the cause:

      - workflow_bug: the workflow file or its sidecar scripts are wrong
        (a bad path, a step that never writes the file a later step reads, a
        wrong guard, a schema the output cannot satisfy).
      - platform_bug: wfnexus itself misbehaves (the engine, CLI or API).
        Its source is the repo at the `local` project's git root.
      - needs_secret: a secret is missing (the collector marks these). Not code.
      - transient: an interrupted or rate-limited run. Retry, not a fix.
      - reported_outage: the workflow worked and correctly reported a real
        problem in the system it watches. Not a workflow bug.
      - incomplete: a folder with no workflow.yaml. Fixable ONLY if the folder's
        own scripts and a sibling template make the missing definition clear;
        otherwise say what is missing.
      - untracked: a workflow folder not in git. Fixable: add it on a branch.

      Evidence is already in this workspace, because you may not read outside
      it: ./evidence/<finding>/folder is the workflow's folder (secrets left
      out), ./evidence/<finding>/run.txt and run.log are the failing run's steps
      and activity. Cite them as file:line. Never curl /api/runs/<id>/events
      without `once=1`: it is a live stream and does not end. Never read a vault/ directory or a .env/credentials file.

      fixable = true only for workflow_bug, platform_bug, and untracked, or an
      incomplete folder whose definition is clear. Rank fixable ones by count ×
      how much they block, and mark at most {{ .Input.max_fixes }} as `fix_now`.
      Set has_fixes to true when any finding has fix_now. Submit only: the
      platform hands your output to the next steps, do not write a file.
    output_schema:
      type: object
      additionalProperties: false
      required: [has_fixes, diagnoses]
      properties:
        has_fixes: { type: boolean }
        diagnoses:
          type: array
          items:
            type: object
            required: [finding, cause, explanation, evidence, fixable, fix_now, repo, smallest_fix]
            properties:
              finding:      { type: string }
              cause:        { type: string, enum: [workflow_bug, platform_bug, needs_secret, transient, reported_outage, incomplete, untracked, unknown] }
              explanation:  { type: string }
              evidence:     { type: array, items: { type: string } }
              fixable:      { type: boolean }
              fix_now:      { type: boolean }
              repo:         { type: string }
              smallest_fix: { type: string }
              person_action: { type: string }

  # 3a. A branch of the OWNING repo per fix, checked out inside this workspace.
  - id: prepare
    name: Check out a branch per fix
    description: git worktree per fix_now finding at ./fixes/<finding>; untracked folders copied in, secrets left out.
    needs: [diagnose]
    when:
      - path: diagnose.has_fixes
        equals: true
      - path: input.dry_run
        equals: false
    run: |
      cat > diagnosis.json <<'WFX_JSON'
      {{ json .Steps.diagnose }}
      WFX_JSON
      python3 ./prepare.py
    timeout_sec: 300
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }

  # 3b. The fix — only inside those worktrees.
  - id: fix
    name: Fix each finding on its branch
    needs: [prepare]
    when:
      - path: prepare.exitCode
        equals: 0
    # The doctor commits as itself. Without this a commit took whatever user
    # the owning checkout was configured with — a teammate got the credit.
    env:
      GIT_AUTHOR_NAME: wfx workflow-doctor
      GIT_AUTHOR_EMAIL: workflow-doctor@wfnexus.local
      GIT_COMMITTER_NAME: wfx workflow-doctor
      GIT_COMMITTER_EMAIL: workflow-doctor@wfnexus.local
    provider: claude-cli
    skills: [fix-author, test-author, workflow-author, repo-navigator]
    tools: [read, write, edit, grep, glob, bash]
    max_turns: 120
    guardrails:
      - deny: bash
        args_contain: ["git push", "gh pr", "wfx approve", "wfx env set", "git checkout main", "git reset --hard", "kamal", "docker "]
        reason: "fixes are committed on a branch in a worktree; pushing and merging are later, reviewed steps"
    prompt: |
      Fix every diagnosis below with fix_now = true, and nothing else.
      {{ json .Steps.diagnose.diagnoses }}

      Each has a branch of its owning repo checked out at ./fixes/<finding>
      (see ./worktrees.json). Work ONLY there, with paths relative to this
      workspace — `cd fixes/<finding>` — and commit there. Never cd to an
      absolute path; everything you need is inside ./fixes/<finding>.

      - workflow_bug: the smallest change to the workflow or its scripts, then
        `wfx validate <path>/workflow.yaml` until it passes.
      - platform_bug: the smallest code change plus a regression test that FAILS
        without it (run it both ways), then the package's tests.
      - untracked: the folder is already copied into the worktree (worktrees.json
        lists the files). `wfx validate` its workflow.yaml, fix only what stops
        it validating, and commit it. If any copied file holds a secret value
        (`sec seal <file> --check`), delete it from the worktree before committing.
      - incomplete: write the missing workflow.yaml from the folder's own
        scripts and the nearest complete sibling, and validate it.

      Before committing, run `sec seal <file> --check` on every file you add or
      change. A file holding a live value (a host, a key, a token) must not be
      committed as it is: replace the literal with a reference by NAME —
      `${NAME}` under the step's env: in workflow.yaml, `os.environ["NAME"]`
      in a script, and no default that repeats the value. Name it for what it
      is (PROM_URL, not whichever name sec matched). Run `wfx env --project <p>`
      FIRST and use a name the store already holds when one fits; only a name
      it lacks goes in `needs_env`. Search the whole folder for the value
      (`sec seal <file> --check` on every file), defaults and comments included.
      Never print, echo or copy a value to find out what it is.

      A finding in ./findings.json with `previous_review` was attempted before
      and failed verify or was blocked by the reviewer: that text is your brief. Address every point in it,
      and say how in the summary.

      One commit per finding, message: what was broken, the evidence, the fix.
      No Co-authored-by line. Submit the fixes; do not write a file.
    output_schema:
      type: object
      additionalProperties: false
      required: [fixes]
      properties:
        fixes:
          type: array
          items:
            type: object
            required: [finding, files, summary]
            properties:
              finding:  { type: string }
              files:    { type: array, items: { type: string } }
              summary:  { type: string }
              needs_env: { type: array, items: { type: string } }
              test:     { type: string }

  # 4. Proof, not a claim.
  - id: verify
    name: Prove every fix
    description: wfx validate on every changed workflow; the Go suite where Go changed; a committed, clean branch. Exit 0 proven, 1 a fix failed, 4 nothing to verify.
    needs: [fix]
    run: |
      cat > diagnosis.json <<'WFX_JSON'
      {{ json .Steps.diagnose }}
      WFX_JSON
      cat > fixes.json <<'WFX_JSON'
      {{ json .Steps.fix }}
      WFX_JSON
      python3 ./verify.py
    timeout_sec: 1200
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }

  # 5. A second model reads each diff cold.
  - id: review
    name: Review each fix adversarially
    needs: [verify]
    when:
      - path: verify.exitCode
        equals: 0      # 0 = at least one fix proven; 1 = none; 4 = nothing to verify
    # A different model family from the fixer, over an API key: a CLI seat hit
    # its usage limit mid-run (run 11), and automating a subscription seat is
    # what the registry's terms notes warn against.
    provider: gpt
    skills: [pr-reviewer, change-reviewer]
    tools: [read, grep, glob, bash]
    max_turns: 40
    prompt: |
      Review ONLY the fixes ./verify.json marks ok — block every other one.
      ./fixes.json lists fixes; ./worktrees.json says where each branch is
      checked out (./fixes/<finding>); ./verify.json
      has what the checks proved. For each, read `git diff origin/<base>...HEAD`
      (cd into ./fixes/<finding> first,
      relative path) against its diagnosis in ./diagnosis.json. Block it if it fixes a symptom
      not the cause, changes more than the finding needs, weakens a check, a
      guard or a test, or commits anything that looks like a secret. Otherwise
      approve. Set any_approved to true if at least one is approved. Submit
      only; do not write a file.
    output_schema:
      type: object
      additionalProperties: false
      required: [any_approved, verdicts]
      properties:
        any_approved: { type: boolean }
        verdicts:
          type: array
          items:
            type: object
            required: [finding, verdict, reason]
            properties:
              finding: { type: string }
              verdict: { type: string, enum: [approve, block] }
              reason:  { type: string }

  # 6. The approved fixes become pull requests.
  - id: publish
    name: Open a pull request per approved fix
    needs: [review]
    when:
      - path: review.any_approved
        equals: true
    provider: claude-cli
    skills: [pr-publisher]
    tools: [read, bash]
    max_turns: 30
    prompt: |
      For each fix in ./fixes.json whose verdict below is approve: `cd
      fixes/<finding>` (relative), `git push -u origin <branch>`, and
      open a PR against its base. Body: the finding, the diagnosis and its
      evidence (./diagnosis.json), what verify proved (./verify.json), the
      reviewer's reason. Never add a Co-authored-by line. Submit the PRs; do
      not write a file.
      Verdicts: {{ json .Steps.review.verdicts }}
    output_schema:
      type: object
      additionalProperties: false
      required: [prs]
      properties:
        prs:
          type: array
          items:
            type: object
            required: [finding, url, repo]
            properties:
              finding: { type: string }
              url:     { type: string }
              repo:    { type: string }

  # 7a. Merge without asking — only when the person switched it on.
  - id: merge_auto
    name: Merge (auto)
    needs: [publish]
    when:
      - path: input.auto_merge
        equals: true
      - path: publish.prs
        exists: true
    run: &merge |
      cat > prs.json <<'WFX_JSON'
      {{ json .Steps.publish }}
      WFX_JSON
      python3 ./merge.py
    timeout_sec: 300
    gates:
      - field: ok
        equals: false
        action: fail
        message: "a merge or its re-check failed — {{ .Output.stdout }}"
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }

  # 7b. Otherwise a person approves the merge on the run page.
  - id: merge_gated
    name: Merge (approved)
    needs: [publish]
    when:
      - path: input.auto_merge
        equals: false
      - path: publish.prs
        exists: true
    requires_approval: true
    run: *merge
    timeout_sec: 300
    gates:
      - field: ok
        equals: false
        action: fail
        message: "a merge or its re-check failed — {{ .Output.stdout }}"
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }

  # 8. Always: what was done, what was not, and what a person must do.
  - id: report
    name: Report and remember
    needs: [collect, diagnose, prepare, fix, verify, review, publish, merge_auto, merge_gated]
    run: |
      cat > review.json <<'WFX_JSON'
      {{ json .Steps.review }}
      WFX_JSON
      cat > prs.json <<'WFX_JSON'
      {{ json .Steps.publish }}
      WFX_JSON
      cat > diagnosis.json <<'WFX_JSON'
      {{ json .Steps.diagnose }}
      WFX_JSON
      DRY_RUN={{ .Input.dry_run }} COLLECT_EXIT={{ .Steps.collect.exitCode }} python3 ./report.py
    timeout_sec: 120
    gates:
      - field: ok
        equals: false
        action: fail
        message: "the doctor could not look: {{ .Output.stdout }}"
    output_schema:
      type: object
      properties:
        ok:       { type: boolean }
        exitCode: { type: integer }
        stdout:   { type: string }
        stderr:   { type: string }
