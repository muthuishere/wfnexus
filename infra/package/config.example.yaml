#   workflows: ~/.config/wfx/workflows
#   templates: ~/.config/wfx/templates
#   skills: ~/.config/wfx/skills
#   registries: ~/.config/wfx/registries.json
#   work: ~/.local/share/wfnexus/runs
#   ui: /app/ui
