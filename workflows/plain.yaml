# Managed by the wfnexus workflow builder.
# Hand edits are fine; the builder round-trips through the same loader.
name: plain
description: No runs-on anywhere. This is every workflow written before workers existed.
input_schema:
    type: object
steps: []
jobs:
    check:
        steps:
            - id: where
              name: ""
              prompt: ""
              skills: []
              tools: []
              output_schema:
                properties:
                    exitCode:
                        type: integer
                    ok:
                        type: boolean
                    stderr:
                        type: string
                    stdout:
                        type: string
                type: object
              run: echo "ran in-process on $(hostname -s); WFX_RUNNER='${WFX_RUNNER:-<unset — not a worker>}'"
max_parallel: 4
