# whatsapp-group-monitor — a SERVICE module (ADR 0028, issue #84).
#
# One process per WhatsApp account (an exclusive lock), reading the account
# ONCE per tick for every registered watch through the apl-whatsapp adapter
# (cursor, echo ledger), deduping by chat|id, holding each chat's messages
# until it is quiet for 3s, then POSTing the batch to each matching watch's
# workflow hook (ADR 0027): {"message": newest, "messages": [...], "watch", "chat"}.
#
# Register a watch = add a line to the watches file (re-read every tick):
#   [{"name":"ops","chat":"1203…@g.us","hook":"https://wfx.example/hooks/p/ops-bot","tokenEnv":"OPS_HOOK_TOKEN"}]
# The hook token comes from `wfx expose hook <workflow>`; store it once with
# `wfx module config whatsapp-group-monitor` / `wfx env set`, never in the file.
name: whatsapp-group-monitor
version: 0.1.0
kind: service
description: Watches WhatsApp chats for many workflows with one batched read per tick and delivers to their hooks.
inputs:
  label:    { type: string, default: biz, description: the apl whatsapp account label }
  watches:  { type: string, required: true, description: path of the watches JSON file }
  interval: { type: string, default: 30s }
  debounce: { type: string, default: 3s }
outputs:
  delivery: { type: object, description: "hook body: message, messages[], watch, chat" }
requires:
  env: [APL_BIN]
binary:
  carry: deemwar/wfx-wa-monitor@0.1.0   # follow-up: carry delivery; today build apps/api/cmd/wfx-wa-monitor
service:
  command: wfx-wa-monitor
  args: [--label, "{{ .Inputs.label }}", --watches, "{{ .Inputs.watches }}", --interval, "{{ .Inputs.interval }}", --debounce, "{{ .Inputs.debounce }}"]
