# Developer infra for `task api`: Postgres (5460) + MinIO (9030/9031).
# The product stack (server + Postgres) is the docker-compose.yml at the root.
# The name is pinned so the volumes stay bug-fixer-platform_bfp-* as they were
# when this file lived at the root.
name: bug-fixer-platform
services:
  postgres:
    image: postgres:16-alpine
    container_name: bfp-postgres
    environment:
      POSTGRES_USER: bfp
      POSTGRES_PASSWORD: bfp
      POSTGRES_DB: bfp
    ports: ["127.0.0.1:5460:5432"]
    volumes: [bfp-pg:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    container_name: bfp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bfp
      MINIO_ROOT_PASSWORD: bfpbfpbfp
    ports: ["127.0.0.1:9030:9000", "127.0.0.1:9031:9001"]
    volumes: [bfp-minio:/data]
volumes:
  bfp-pg:
  bfp-minio:
